# Единый манифест python-зависимостей: заменил requirements.txt (05.08.2026).
# Установка: .venv/bin/pip install . — ставятся зависимости и метаданные
# локальной дистрибуции charoite-0.0.0. Модулей в ней нет (py-modules пуст):
# скрипты по-прежнему запускаются из репозитория через .venv/bin/python.
#
# Версии закреплены по нижней границе: onnxruntime и numpy 2.x расходятся
# регулярно, а установка без пинов даёт разные окружения в разные дни.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "charoite"
# Версию продукта ведёт release-please в CHANGELOG; пакет не публикуется,
# поэтому здесь константа.
version = "0.0.0"
description = "Charoite: local-first meeting conveyor (STT, diarization, graph)"
# 3.11 — та же граница, что проверяет scripts/doctor.py и обещает README.
# Раньше здесь стояло >=3.10: pip ставил пакет на 3.10, а doctor тут же
# требовал 3.11 — противоречие, которое человек видит уже после установки.
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "sounddevice>=0.4.6",
    "pyyaml>=6.0",
    "requests>=2.31",
    "websockets>=12.0",
    "rich>=13.0",
    "onnx-asr>=0.3",
    "onnxruntime>=1.17",
    "mcp>=1.0",
    # NLI-дедуп тезисов (src/nli.py); лёгкий, без torch
    "tokenizers>=0.15",
    # чтение/запись wav в диаризации и пересборке стенограммы
    "soundfile>=0.12",
    # ERes2Net-эмбеддинги: без него диаризация молча выключена
    "sherpa-onnx>=1.10",
    # Бэкенды STT — ставится тот, что выбран в stt.backend.
    # gigaam работает на onnx-asr выше; для остальных нужны свои пакеты:
    "parakeet-mlx>=0.2 ; sys_platform == 'darwin'",  # английский пресет
    "mlx-whisper>=0.4 ; sys_platform == 'darwin'",   # китайский/мультиязычный пресет
]

[tool.setuptools]
# Пустой список — pip install . не копирует исходные модули в site-packages;
# там остаются только стандартные метаданные дистрибуции. Репозиторий остаётся
# рабочей директорией, а не импортируемым Python-пакетом.
py-modules = []

[tool.pytest.ini_options]
# Потолок на ОДИН тест. Наши тесты поднимают потоки захвата и ждут их
# завершения; сломанная логика остановки вешает не свой тест, а весь
# прогон, и в логе видно только «джоб убит по таймауту» — без имени
# виновника. 120 с с запасом: самый долгий честный тест — это секунды.
timeout = 120
# Pytest уже перехватывает `threading.excepthook`, но по умолчанию превращает
# падение фонового потока лишь в warning и оставляет прогон зелёным. Так CI
# пропустил AttributeError в AudioHub._pump. ГРАНИЦА гейта (круг по #420,
# DS): эскалация ловит крэш, случившийся В ОКНЕ своего теста; поток,
# протёкший за границу теста и упавший позже, приписывается закрытому
# отчёту и прогон остаётся зелёным — поздние крэши ловит только
# join-дисциплина (каждый поднятый тестом поток join-ится в его границах).
# Не ужесточаем все warnings — только этот класс.
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]

# Chinese demo bench cases — run with --demo-zh against demo/graph_zh.
- q: "支付服务商最后定了哪一家？"
  must: ["YuPay"]
- q: "现在有哪些阻碍？"
  must: ["PCI"]
- q: "网店计划什么时候上线？"
  # не голая «9»: она проходила на любом ответе с девяткой. Пробелы и
  # полноширинные формы («9 月», «９月») сверка сама схлопывает; ответ
  # китайскими цифрами («九月一日») здесь честно считается провалом —
  # промпт просит конкретные факты из фрагментов, а во фрагментах «9月1日»
  must: ["9月"]

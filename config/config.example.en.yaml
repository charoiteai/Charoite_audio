# Charoite — English preset. Copy to config/config.yaml and adjust.
# Everything runs locally: audio, speech recognition, diarization, LLM — on your machine.
# This preset differs from config.example.yaml (Russian default) in three places:
# stt.backend (Parakeet — English SOTA on Apple Silicon, no GigaAM), stt.language,
# sufler.language (meeting documents in English) and an English sufler.role prompt.

audio:
  device: auto            # auto = microphone + system audio (BlackHole, if installed)
  samplerate: 16000
  chunk_seconds: 3.0
  overlap_seconds: 0.5
  vad_energy_db: -55      # silence threshold; lower = more sensitive
  record: true            # keep the full recording for the offline transcript re-pass
  record_keep_days: 2     # recordings are deleted after N days (privacy)
  import_keep_days: 2     # copies of imported recordings (done/ and the audio source in the archive) — N days after import (independent of record_keep_days)
  # import_dir: ~/Charoite Inbox   # import folder for the daemon's retention sweep, in addition to the folder chosen in the app: the daemon sweeps both

stt:
  backend: parakeet       # parakeet (English, fast) | whisper (multilingual) | gigaam (Russian)
  gigaam_model: gigaam-v3-e2e-rnnt
  parakeet_model: mlx-community/parakeet-tdt-0.6b-v3
  whisper_model: mlx-community/whisper-large-v3-turbo
  # sensevoice_model: models/stt/sensevoice.onnx   # for stt.backend: sensevoice
  language: en

llm:
  base_url: http://localhost:11434   # Ollama
  # allow_remote: true   # EXPLICIT permission to send requests off this machine:
  #                      # transcripts follow base_url, so another machine is a
  #                      # privacy decision, not a tuning knob.
  #                      # CHAROITE_NO_CLOUD=1 refuses even this. See PRIVACY.md
  # Chat engine: ollama (default) or mlx-server — the OpenAI-compatible
  # mlx_lm.server with prefix caching: the live meeting thread gets 0.3s
  # prefill instead of 30s (measured 2026-08-14). The server serves the one
  # model it was started with (mlx_model, a HF repo name); small/fallback
  # collapse into it. Embeddings (bge-m3) stay on Ollama either way.
  # engine: ollama
  # A third engine — cloud: the whole chat goes to an OpenAI-compatible
  # gateway and the laptop stops holding a large model. It takes TWO keys:
  # llm.engine: cloud here and sufler.cloud_engine: true below — an address
  # without permission does nothing, and so does permission without an
  # address. The gateway key never lives in the config: it is read from a
  # separate file (cloud_key_file, mode 600). If the network drops, the local
  # model answers unless cloud_fallback_local is off. Embeddings, NLI and STT
  # stay local with any engine.
  # cloud_base_url: https://api.example.com/v1
  # cloud_model: deepseek-chat
  # cloud_key_file: ~/.config/charoite/llm_key
  # cloud_fallback_local: true
  # Which local engine the net falls back to: ollama or mlx-server.
  # Without the key mlx-server is chosen when mlx_model is set, otherwise
  # ollama — a net in an empty Ollama would be dead for anyone whose local
  # model lives on mlx_lm.server.
  # cloud_fallback_engine: ollama
  # mlx_base_url: http://127.0.0.1:8080
  # mlx_model: mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit
  model: qwen3.6:35b-a3b             # main model (hints, summaries, names)
  small_model: qwen3.5:4b            # light model (theses, classification) — 3.4GB
  fallback_model: gemma4:latest
  # Presets (see docs/MODELS.md):
  #  16GB RAM:  model: gemma4:latest · small_model: qwen3.5:2b
  max_context_chars: 6000
  temperature: 0.4
  num_ctx: 8192                      # required: without it the KV cache balloons
  # Model call ledger: one line per request — who asked (hints, minutes, graph
  # extraction…), model, tokens, seconds, busy wait. No text. One file per day
  # logs/model_calls-YYYY-MM-DD.jsonl, append-only: no retention term yet, delete
  # old days yourself. Exactly 0 — do not write (earlier days stay).
  # ledger_keep_days: 0

sufler:
  # --- owner ---
  user_name: ""           # your name: labels your microphone and addresses you in hints
  user_context: ""        # 1-2 sentences about you/your work — context for answers
                          # (e.g. "Data platform tech lead: pipelines, marts, LLM.")

  quiet: true             # quiet mode: background on the light model, heavy one on demand
  instant: true           # instant answer when the other side asks you a question (⚡)
  think_model: qwen3.6:35b-a3b

  # Language of meeting DOCUMENTS: hints, summaries, minutes, graph field
  # values (ru | en). Not the same as stt.language above — that one is about
  # speech recognition. You can listen in one language and write documents
  # in another. Graph section/folder names are Russian in both modes for now
  # (see ROADMAP).
  language: en
  # voice diary (⌥⌘J) — a SEPARATE sphere-folder; empty = "Diary" next to the graph.
  diary_dir: ""
  # replacement dictionary: STT mangles names and jargon — fix it declaratively,
  # case-insensitive, word-boundary aware; applies to live meetings, dictation,
  # notes and imports
  vocabulary: {}
  # example:
  # vocabulary:
  #   "charoid": "Charoite"
  # command after every meeting (live or imported): a local webhook analogue;
  # receives SUFLER_TRANSCRIPT and SUFLER_STAMP env vars
  post_meeting_hook: ""
  # live context: pull past decisions from the archive into the hint prompt
  # based on the topic of the ongoing meeting; refresh every interval seconds
  live_context: true
  live_context_interval: 600
  # hint ladder: instant local answer → cloud refinement (Claude CLI) appended.
  # WARNING: sends the transcript to the cloud on every hint — hence a separate
  # switch, default OFF
  cloud_hints: false
  cloud_hints_model: claude-haiku-4-5

  # --- knowledge graph (optional; empty = off) ---
  graph_dir: ""           # Obsidian graph folder, e.g. ~/Documents/Charoite/Work
  # custom minutes template (optional): a markdown skeleton with your team's
  # sections; empty — default (Topics/Decisions/Actions/Questions/Risks)
  # minutes_template: |
  #   # Minutes
  #   ## Agenda
  #   ## Agreed
  #   ## Actions
  default_project: Work   # which graph receives work meetings
  graph_context_chars: 2500
  # bge-m3 embedder during a live meeting (false on 8 GB). The déjà-vu loop and
  # the meeting auto-brief were removed (~19 lines per meeting, 2 in 10 on topic);
  # the flag is kept for a semantic check of Cores on auto-⏮ — until that lands it
  # switches nothing on during a meeting.
  deja_vu: true
  # Ollama embedding model (the embedder door). The Tier3 core revision is
  # pinned to bge-m3 on purpose — its pair-selection threshold (EMB_PREFILTER
  # in src/tier3.py) is tuned to this model's cosine spread
  embed_model: bge-m3:latest
  # Tier3 core revision after every meeting. false — duplicates and nestings
  # are marked in the graph reversibly (a "possible duplicate" line picked up
  # by the morning brief) but cores are not merged: merging rewrites the file
  # (the duplicate becomes a redirect, the original goes to Cores/.tier3_backup/),
  # so by default a human runs it: scripts/tier3_cores.py --apply.
  # true merges only high-confidence pairs.
  tier3_auto_apply: false
  # Second extraction pass in smaller chunks (6000 characters instead of 12000): measured on
  # 27.10, decision coverage 77–82 % vs 57–65 % with one pass, at +2–2.5 model minutes per
  # meeting. Without the key it is on only where it was measured: llm.model: qwen3.6:35b-mlx on
  # Ollama with language: ru (or empty); off on other models. false turns it off, true turns it on
  # for any model. Russian meetings only (language: ru exactly; ru-RU is skipped) — the merge threshold was measured on them.
  # graph_second_pass: true
  # Merge rewordings of one decision across the whole extraction list (chunks overlap and the
  # minutes land in two chunks): no model call; measured on 28.10 it removed 5 of 25 extra lines
  # with no false merges. On by default, Russian meetings only (language: ru); false turns it off.
  # graph_decision_merge: true
  # Link byte-identical copies of meeting documents (the original under
  # "Документация", the copy under "Встречи-архив" for Finder) with hard
  # links: disk space and iCloud sync stop doubling, both paths keep
  # working. Off by default: the content does not change, but editing the
  # archived copy becomes editing the original — a surprise for anyone who
  # believed it was independent.
  dedup_files: false

  # --- cloud layer (optional; keep off — everything stays local) ---
  cloud_enrich: false     # post-meeting review by cloud Claude (needs claude CLI)
  cloud_debrief_model: claude-sonnet-5-5  # debrief model; back to Opus —
                                          # cloud_debrief_model: claude-opus-5
  cloud_model: claude-opus-5  # nightly core and dossier reviews (not the debrief)
  cloud_effort: medium    # debrief effort: low|medium|high|xhigh|max|auto; medium keeps the
                          # debrief inside the 30-minute ceiling, high/max take up to 2x longer
  cloud_live_effort: low  # effort for in-meeting calls (thread, answer to a question)
  cloud_night_effort: high  # nightly dossier and core reviews: 600 s ceiling, depth first
  # Nightly core review provider: anthropic (default, claude -p) or tinfoil — a
  # model in an attested enclave; the client checks the AMD signature and the
  # router code against a signed release (pip install 'charoite[tinfoil]', see
  # PRIVACY.md). Dossiers are skipped under tinfoil for now. Any other value is a
  # refusal: nothing is sent.
  # cloud_night_provider: tinfoil
  cloud_night_tinfoil_model: deepseek-v4-1-flash  # core review model at Tinfoil
  cloud_night_tinfoil_effort: max  # effort at Tinfoil: low|high|xhigh|max (no medium)
  cloud_night_tinfoil_key_path: ~/.config/charoite/tinfoil_key  # API key, mode 600
  # Personal-data mask before the cloud (post-meeting debrief and nightly reviews):
  # names of people and systems from the graph, plus names found by the name model,
  # are replaced with IDs; the reply is mapped back on this Mac. Only
  # cloud_mask: false turns it off. Level basic — graph dictionaries + Slovnet
  # (pip install natasha==1.6.0); full is the next stage and is refused for now.
  cloud_mask: true
  cloud_mask_level: basic
  cloud_edit_graph: false
  cloud_engine: false     # whole chat through the cloud gateway (see llm.engine: cloud)
  # ↑ LET THE CLOUD EDIT THE GRAPH (optional, off by default).
  # Without it Opus only writes a report and a human applies the fixes.
  # With it, Opus edits at night from its own findings: superseded decisions,
  # expired deadlines, contradictions between sources. The local model builds
  # dossiers in bulk; the cloud does a second pass and sees the links between them.
  # Edits: dossiers (derived summaries) and prose sections of cores.
  # Never edits: transcripts, minutes, the "## Author edits" section.
  # Every edit is backed up to `Dossiers/.backup/<date>/` first.
  cloud_live: false       # parallel Claude answers to questions mid-meeting
  cloud_live_model: claude-haiku-4-5

  fast_trigger: true      # early question detection via streaming STT (if running)
  # Decision gate in shadow mode: next to every ⚡ a local decision model judges
  # whether it was a real question and logs the verdict with the answer outcome
  # to logs/daemon.err.log (no utterance text). Decides nothing — collects data
  # for scripts/gate_bench.py shadow. Needs the NLI model in models/nli/ or a
  # trained head in models/decision/question_gate/. Hypotheses are Russian today.
  decision_gate_shadow: false
  live_diarize: true      # live "Speaker 1/2/…" labels
  live_diarize_threshold: 0.45
  # Who labels the call voices after the meeting: sherpa (built in) or
  # nemotron — NVIDIA Nemotron 3 Diarization on Apple Silicon, two voices at
  # once and seconds instead of minutes (docs/DIARIZATION.md). Nemotron lives
  # in its own environment with mlx-audio, installed by
  # scripts/install_engine.py nemotron; an empty nemotron_python means that
  # environment, otherwise the path to your own bin/python. If it fails, sherpa
  # labels the voices and the transcript header says why.
  diarize_backend: sherpa
  nemotron_python: ""
  # Live Nemotron stream on the call channel: off, shadow or on (labels in the live
  # transcript; needs models/diar — docs/DIARIZATION.md). MLX cache capped at 512 MB.
  # Roll out off → shadow → on. In shadow mode a
  # separate engine process (same environment) listens to the call and writes
  # its labels to logs/nemotron_live_<stamp>.jsonl next to what the live tracker
  # did — numbers, no audio and no utterance text. The transcript does not change:
  # this measures delay, cost and label agreement before the live path moves to
  # Nemotron (docs/DIARIZATION.md). The price is a second model process on the call.
  live_nemotron: off
  live_dialog_markup: true  # a light model splits paragraphs into speaker turns
  markup_model: gemma4:latest  # markup must not paraphrase — gemma keeps words intact

  # The sufler role: what kind of meetings to tune hints for. Edit freely.
  role: |
    You are a meeting copilot. You help the user based on the live transcript.
    From the transcript give BRIEFLY: 1) the essence of the last question
    addressed to the user; 2) a ready first-person answer; 3) what to clarify.
    In English, no filler.
  hotkey_hint: "Enter — hint on the last 2 minutes; s — summary; q — quit"

  # Your own minutes template: sections and their order, to your team's rules.
  # Empty — the built-in format (topics → decisions → action items → open).
  minutes_template: ""

log:
  transcripts_dir: transcripts
  recordings_dir: recordings

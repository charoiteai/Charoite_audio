# Мини-бенч памяти: вопрос → факты, ОБЯЗАННЫЕ быть в ответе RAG-контура.
# Скопируйте в config/memory_bench.yaml и наполните вопросами по СВОЕМУ
# графу — примеры ниже показывают формат. Сверка подстрокой, ё=е.
# Гоняется scripts/memory_bench.py (вручную или в ночной scripts/nightly.sh).

- q: "Что решили по доступу к API на прошлой неделе?"
  must: ["токен"]

- q: "Какую модель выбрали для пилота?"
  must: ["Qwen"]

- q: "Какие ограничения у токена доступа?"
  must: ["минут"]

# Charoite — конфигурация. Скопируйте в config/config.yaml и подставьте своё.
# Всё работает локально: аудио, распознавание, диаризация, LLM — на вашей машине.

audio:
  device: auto            # auto = микрофон + системный звук (BlackHole, если установлен)
  samplerate: 16000
  chunk_seconds: 3.0
  overlap_seconds: 0.5
  vad_energy_db: -55      # порог тишины; тише — чувствительнее
  record: true            # писать полную запись для оффлайн-пересборки стенограммы
  record_keep_days: 2     # записи удаляются через N дней (приватность)

stt:
  backend: gigaam         # gigaam (русский, быстрый) | parakeet | whisper
  gigaam_model: gigaam-v3-e2e-rnnt
  parakeet_model: mlx-community/parakeet-tdt-0.6b-v3
  whisper_model: mlx-community/whisper-large-v3-turbo
  # sensevoice_model: models/stt/sensevoice.onnx   # для stt.backend: sensevoice
  language: ru

llm:
  base_url: http://localhost:11434   # Ollama
  # allow_remote: true   # ЯВНОЕ разрешение слать запросы НЕ на этот компьютер:
  #                      # стенограммы уходят по адресу base_url, поэтому чужая
  #                      # машина — решение о приватности, а не тюнинг.
  #                      # CHAROITE_NO_CLOUD=1 запрещает и это. См. PRIVACY.md
  # Движок чата: ollama (умолчание) или mlx-server — OpenAI-совместимый
  # mlx_lm.server с кэшем префикса: живая нить встречи получает префилл
  # 0.3с вместо 30с (замер 14.08). Сервер обслуживает одну модель
  # (mlx_model, имя HF-репозитория); small/fallback на нём схлопываются в
  # неё же. Эмбеддинги (bge-m3) при любом движке остаются на Ollama.
  # engine: ollama
  # mlx_base_url: http://127.0.0.1:8080
  # mlx_model: mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit
  # Шаблон стартует с моделей профиля 8/16 ГБ: одна лёгкая на все роли.
  # Семантические контуры (deja_vu, tier3) ниже включены — это набор 16 ГБ;
  # на 8 ГБ выключите их или примените профиль «Лёгкий» в приложении. Раньше здесь стоял qwen3.6:35b-a3b (23 ГБ), и установка
  # «способом B» — cp config.example.yaml config.yaml — уходила в своп ещё до
  # того, как человек доходил до выбора профиля. Первая правка 19.08 поставила
  # сюда gemma4:12b, но вместе с think_model и эмбеддером это те же 17–19 ГБ
  # на 16-гигабайтной машине, от которых отказался сам профиль (второй круг,
  # DeepSeek). Тяжёлые модели ставит профиль в приложении или вы руками.
  model: qwen3.5:4b                  # основная модель (подсказки, саммари, имена) — 3.2 ГБ
  small_model: qwen3.5:4b            # лёгкая (тезисы, классификация) — та же
  fallback_model: qwen3.5:4b
  # Профили по памяти (см. docs/MODELS.md, таблица «Какие модели под вашу RAM»):
  #   8 ГБ:  model: qwen3.5:4b · small_model: qwen3.5:4b · deja_vu: false · tier3: false
  #  16 ГБ:  model: qwen3.5:4b · small_model: qwen3.5:4b (набор этого шаблона)
  #  32 ГБ:  model: qwen3.8:27b-mlx · small_model: qwen3.5:4b
  #  64 ГБ:  model: qwen3.6:35b-mlx · small_model: qwen3.5:4b
  #  English:   stt.backend: parakeet · промпты в sufler.role — на английский
  max_context_chars: 6000
  temperature: 0.4
  num_ctx: 8192                      # обязательный: без него KV-кэш раздувается

sufler:
  # --- владелец ---
  user_name: ""           # ваше имя: метка вашего микрофона и обращение в подсказках
  user_context: ""        # 1-2 предложения о вас/вашей работе — контекст для ответов
                          # (например: «Техлид дата-платформы: пайплайны, витрины, LLM.»)

  quiet: true             # тихий режим: фон на лёгкой модели, тяжёлая — точечно
  instant: true           # мгновенный ответ на вопрос собеседника (⚡)
  think_model: qwen3.5:4b   # тезисы и черновик минуток; профиль ставит свою

  # Язык ДОКУМЕНТОВ встречи: подсказки, саммари, минутки, значения полей
  # графа (ru | en). Не путать со stt.language выше — тот про распознавание
  # речи. Слушать можно по-русски, а писать документы по-английски.
  # Имена разделов и папок графа пока русские в обоих режимах (ROADMAP).
  language: ru
  # дневник (⌥⌘J) — ОТДЕЛЬНАЯ сфера-папка; пусто = сосед графа «Дневник».
  # Личное не всплывает в рабочем поиске; ссылки между сферами работают.
  diary_dir: ""
  # словарь замен для распознавания: STT коверкает термины и фамилии —
  # чиним декларативно, регистронезависимо, по границам слов; работает
  # на живой записи, диктовке, заметках и импорте
  vocabulary: {}
  # пример:
  # vocabulary:
  #   "чароид": "Чароит"
  # команда после каждой встречи (живой или импортированной): локальный
  # аналог webhooks; получает env SUFLER_TRANSCRIPT и SUFLER_STAMP
  post_meeting_hook: ""
  # автостоп записи: 17.08 встреча кончилась, «Стоп» не нажали, и ноутбук
  # писал пустую комнату 18 часов. Тишина считается по РАСПОЗНАННОЙ речи, а не
  # по громкости (кулер и клавиатура — не разговор), и только по новым строкам
  # стенограммы. Обратная сторона честно: громкая фоновая речь — телевизор,
  # радио, видео — для нас разговор, такую запись остановит только потолок.
  # Число говорящих в правиле НЕ участвует: без моделей диаризации все реплики
  # очной встречи идут одной меткой, и «один голос» ничего не значит.
  # За минуту до стопа приходит предупреждение, любая речь его снимает.
  # Ноль выключает своё правило, `autostop: false` — всё сразу.
  autostop:
    enabled: true
    no_speech_minutes: 5   # речи не было ни разу с начала записи (0 — не считать)
    silence_minutes: 15    # тишина после того, как разговор был
    # то же, но собеседников не было слышно ни разу: говорил только владелец.
    # Признак канальный (системный звук молчал всю запись), поэтому ОЧНУЮ
    # встречу он не отличает от диктофона — все голоса идут в микрофон. У кого
    # встречи очные: поставьте 15, и правило перестанет что-либо менять; 0 —
    # выключить его и оставить обычную тишину. Если silence_minutes: 0 (тишину
    # после разговора не считаем), правило по умолчанию тоже молчит — но
    # заданный здесь ЯВНО порог работает и в этом случае.
    # ⚠️ значение ниже no_speech_minutes зажимается вверх до него: одинокая
    # запись не должна резаться раньше пустой комнаты.
    alone_minutes: 10
    max_hours: 6           # потолок длительности записи (0 — без потолка)
    warn_seconds: 60       # предупреждение перед стопом
    min_minutes: 2         # первые минуты записи не трогаем
  # живой контекст: по теме идущей встречи подтягивать из архива прошлые
  # договорённости в промпт подсказок; обновление раз в interval секунд
  live_context: true
  live_context_interval: 600
  # лестница для подсказок: локальная мгновенно → облачное уточнение (Claude
  # CLI) в ленту. ВНИМАНИЕ: шлёт стенограмму в облако на каждую подсказку —
  # поэтому отдельный выключатель и дефолт OFF
  cloud_hints: false
  cloud_hints_model: claude-haiku-4-5

  # --- граф знаний (опционально; пусто = выключено) ---
  # Собирать ли граф знаний после встречи (узлы Встречи/Люди/Системы/Ядра).
  # Выключен — узлы не строятся, а стенограмма, минутки, архив встречи, копии
  # в vault и post_meeting_hook собираются как обычно, и встреча получает
  # честный статус «готово», а не «ошибка обработки».
  # Профили установки его НЕ выключают: бенч 19.08 показал, что даже
  # qwen3.5:4b (3.2 ГБ) разбирает граф — 31 решение и 96% цитат на трёх
  # реальных встречах. Это ручной выключатель для того, кому граф не нужен.
  graph: true
  # Ревизия ядер (tier3): ищет дубли и вложенность по эмбеддингам, поэтому
  # держит рядом bge-m3 (+1.2 ГБ). На лёгком профиле выключается вместе с
  # дежавю — иначе обещание «эмбеддер здесь не живёт» неправда.
  tier3: true
  graph_dir: ""           # папка Obsidian-графа, например ~/Documents/Charoite/Work;
                          # относительный путь (demo/graph) приложение и демон
                          # считают одинаково — от папки данных Чароита
  # свой шаблон минуток (опционально): markdown-скелет с разделами под
  # вашу команду; пусто — дефолт (Темы/Решения/Поручения/Вопросы/Риски)
  # minutes_template: |
  #   # Минутки
  #   ## Повестка
  #   ## Договорились
  #   ## Действия
  default_project: Работа # в какой граф складывать рабочие встречи
  graph_context_chars: 2500
  deja_vu: true           # «⏮ уже обсуждалось DD.MM» — темы из Ядер в тезисах
  deja_vu_margin: 0.04    # запас над порогом похожести: больше — реже «уже обсуждалось»
  # эмбеддинги для deja_vu (Ollama). Только для него: Tier3-ревизия ядер
  # прибита к bge-m3 намеренно — её порог отбора пар (EMB_PREFILTER в
  # src/tier3.py) выставлен по разбросу косинусов именно этой модели
  embed_model: bge-m3:latest
  meeting_brief: true     # авто-бриф в начале встречи: контекст из архива по теме
  # Tier3-ревизия ядер после каждой встречи. false — дубли и вложения
  # помечаются в графе обратимо (строка «возможный дубль», её собирает
  # утренний бриф), но ядра не сливаются: слияние перезаписывает файл (от
  # дубля остаётся redirect, оригинал — в Ядра/.tier3_backup/), поэтому по
  # умолчанию его делает человек: scripts/tier3_cores.py --apply.
  # true сливает только пары с высокой уверенностью: сравниваются суть и
  # хроника, и если суть у обоих ядер взята из автостатуса (у ядра от
  # экстрактора так всегда), нужна планка выше и непересекающиеся хроники —
  # две живые задачи одного проекта ходят по одним встречам и на статус
  # похожи сами по себе. Всё, что ниже, остаётся пометкой
  tier3_auto_apply: false
  # Побайтовые копии документов встречи (оригинал в «Документация»,
  # копия в «Встречи-архив» для Finder) связывать жёсткими ссылками:
  # место и синхронизация iCloud перестают удваиваться, оба пути
  # остаются рабочими. Выключено по умолчанию: содержимое не меняется,
  # но правка архивной копии становится правкой оригинала, и это
  # неожиданно для того, кто считал её независимой.
  dedup_files: false

  # Проверка версии: раз в сутки приложение спрашивает у GitHub номер
  # последнего выпуска — обычный GET к публичному API, без токена и без
  # данных о вас. Нужна затем, что приложение, код в рабочей папке и выпуск
  # расходятся молча, и работу на старом коде замечаешь по чужим ошибкам.
  # false — сверяться только с рабочей папкой, в сеть не ходить.
  check_updates: true

  # --- облачный слой (опционально; выключите — всё останется локальным) ---
  cloud_enrich: false     # разбор встречи облачным Claude после стопа (нужен claude CLI)
  cloud_model: claude-opus-5
  cloud_edit_graph: false
  # ↑ РАЗРЕШИТЬ ОБЛАКУ ПРАВИТЬ ГРАФ (опционально, по умолчанию выключено).
  # Без него Opus только пишет отчёт-рекомендации, правит человек руками.
  # С ним — правит сам, ночью, по своим же находкам: отменённые решения,
  # протухшие сроки, расхождения между источниками. Локальная модель собирает
  # досье массово и дёшево, облако проходит вторым и видит связи между узлами.
  # Правит: досье (производные сводки) и текстовые разделы ядер.
  # НЕ правит никогда: стенограммы, минутки, раздел «## Правки автора».
  # Перед каждой правкой — бэкап в `Досье/.backup/<дата>/`.
  cloud_live: false       # параллельный ответ Claude на вопросы по ходу встречи
  cloud_live_model: claude-haiku-4-5

  fast_trigger: true      # ранний детект вопросов через стриминговый STT (если поднят)
  live_diarize: true      # живая диаризация «Собеседник 1/2/…»
  live_diarize_threshold: 0.45
  live_dialog_markup: true  # лёгкая модель расставляет реплики внутри абзацев
  # Разметке нужна дословность: валидация сверяет слова и отбрасывает ответ,
  # где модель хоть что-то поправила. Раньше здесь стоял gemma4:latest
  # (8.9 ГБ), которого не качает ни один профиль: контур молча стучался в
  # отсутствующую модель (ревью 19.08, GLM). Теперь — модель, которая на
  # машине и так резидентна; на лёгких профилях это 4B, и она правит слова
  # чаще, поэтому разметка там срабатывает реже (второй круг, DeepSeek).
  markup_model: qwen3.5:4b

  # Роль суфлёра: под какие встречи затачивать подсказки. Правьте свободно.
  # Роль отвечает на вопрос «кто ты и в каком контексте»: тема проекта, ваша
  # должность, термины. Формат подсказки задавать здесь НЕ нужно — он живёт в
  # коде (src/llm.py, HINT_FORMAT) и одинаков для всех: тема сейчас → кто что
  # сказал → почему → что было раньше → что открыто.
  role: |
    Ты — суфлёр на рабочей встрече. Помогаешь пользователю по живой стенограмме.
    Контекст: опишите здесь проект, вашу роль и термины, которые звучат на
    встречах, — этим модель отличит имена систем от обычных слов.
  hotkey_hint: "Enter — подсказка по последним 2 минутам; s — саммари; q — выход"

  # Свой шаблон минуток: разделы и их порядок под ваши правила протокола.
  # Пусто — встроенный формат (темы → решения → поручения → открытое).
  # Описан в docs/FEATURES.md, но в примере конфига до сих пор не значился —
  # то есть узнать о нём при настройке было неоткуда.
  minutes_template: ""

log:
  transcripts_dir: transcripts
  recordings_dir: recordings

# Демо-бенч эмбеддингов: синтетический русский набор для сравнения моделей
# текстовых эмбеддингов внутри Charoite. Гоняется scripts/embed_bench.py.
# Все данные вымышлены: компания «Северный ветер» (сеть магазинов товаров
# для дома), её команда платформы данных, подрядчики «Кедр-Логистик»,
# «Полярный софт», облако «Сосна». Совпадения с реальными людьми и
# организациями случайны; люди — только роли и вымышленные имена.
#
# Разделы:
#   cores      — 45 ядер графа знаний: имя, автостатус, подробности (details).
#                Есть 6 кластеров «один проект — разные задачи» (c01–c03,
#                c04–c06, c07–c09, c10–c12, c13–c15, c16–c18) для трудного
#                различения.
#   fragments  — «Дежавю»: по 2 сырых фрагмента STT на ядро (без пунктуации,
#                со словами-паразитами); второй — косвеннее первого. Фрагмент
#                делит с именем ядра не больше одного значимого слова.
#   off_topic  — фрагменты, которые НЕ должны срабатывать: 20 явно посторонних
#                и 10 «почти попаданий» (та же лексика, другая тема).
#   pairs      — «Ревизия ядер» (tier3): пары «Имя. суть» с меткой
#                dup (одна тема, разные слова) | related (один проект, разные
#                задачи — сливать нельзя) | unrelated.
#   queries    — поиск по памяти: вопрос → id ядер, которые на него отвечают.
#   traps      — вопросы, ответа на которые в корпусе нет (система должна
#                сказать «не знаю»); последние 8 — «почти попадания».

cores:
  # --- Кластер «Переезд»: Greenplum → ClickHouse ---
  - id: "c01"
    name: "Перенос витрины продаж на ClickHouse"
    status: "основные таблицы перенесены, сверка со старым контуром расходится на 0,3% из-за возвратов"
    details: "Витрину продаж переносят из Greenplum в ClickHouse в рамках проекта «Переезд», ответственный — ведущий дата-инженер Олег. Сверку со старым контуром делают по 14 ключевым метрикам, допустимое расхождение — 0,1%. Расхождение 0,3% нашли в возвратах: в новом контуре теряются возвраты без чека. Переключение отчётов на новую витрину назначено на 20 ноября."
  - id: "c02"
    name: "Отключение старого кластера Greenplum"
    status: "отключение назначено на 25 января, три потребителя всё ещё читают старые таблицы"
    details: "Старый кластер Greenplum из 12 сегмент-серверов выводят из эксплуатации после проекта «Переезд». С 15 декабря он работает только на чтение, окончательное отключение — 25 января. Старые таблицы всё ещё читают финансовый отдел, склад и кадровая отчётность. Освободившееся железо отдают под тестовую среду."
  - id: "c03"
    name: "Обучение аналитиков новому SQL-диалекту"
    status: "проведены две сессии из четырёх, больше всего вопросов по оконным функциям и датам"
    details: "Для аналитиков проводят четыре практические сессии по SQL ClickHouse, ведёт Марина из команды платформы. Главные трудности — оконные функции, работа с датами и отсутствие привычных UPDATE. Записи сессий и шпаргалку выкладывают в базу знаний. В конце курса зачёт: каждый аналитик переписывает один свой отчёт под новый движок."

  # --- Кластер «Поток заказов из Kafka» ---
  - id: "c04"
    name: "Ночные падения загрузки заказов из Kafka"
    status: "три ночных падения за неделю, временно включён автоперезапуск, корневая причина не устранена"
    details: "Поток заказов интернет-магазина из Kafka в хранилище падал три ночи подряд около 03:00. Падения совпадают с ночным бэкапом PostgreSQL на том же узле, коннектор упирается в таймаут. Временное решение — автоперезапуск коннектора, дежурный Тимур проверяет поток утром. Постоянное решение — развести бэкап и загрузку по времени до конца месяца."
  - id: "c05"
    name: "Мониторинг отставания консьюмеров Kafka"
    status: "дашборд лагов собран в Grafana, пороги алертов ещё не согласованы с дежурными"
    details: "Для потоков Kafka настроили дашборд отставания консьюмер-групп в Grafana. Предложенный порог алерта — больше 50 тысяч непрочитанных сообщений или задержка больше 10 минут. Дежурные просят не слать ночные алерты по некритичным топикам. Владелец задачи — Ксения, пороги нужно согласовать до следующей ретроспективы."
  - id: "c06"
    name: "Дубли заказов после повторной отправки"
    status: "найдено около 4 тысяч задвоенных заказов за октябрь, дедупликация в работе"
    details: "После сбоя продюсер интернет-магазина повторно отправил сообщения, и в хранилище задвоились около 4 тысяч заказов за октябрь. Из-за этого выручка в дашборде завышена примерно на 1,2 миллиона рублей. Решили делать дедупликацию по идентификатору заказа и времени создания на слое staging. Ответственный — Ильдар, финансам отчитаются после пересчёта."

  # --- Кластер «Прогноз спроса» ---
  - id: "c07"
    name: "Пилот модели прогноза спроса"
    status: "пилот идёт на 30 магазинах, ошибка прогноза ниже ручного планирования примерно на 18%"
    details: "Модель прогноза спроса на градиентном бустинге тестируют на 30 магазинах Северо-Западного региона. Ошибка MAPE снизилась с 34% при ручном планировании до 28%. Хуже всего модель работает на сезонных товарах и новинках без истории продаж. Итоги пилота представят директору по закупкам в конце ноября."
  - id: "c08"
    name: "Вывод прогноза спроса в продуктив"
    status: "сервис развёрнут в тестовой среде, промышленный запуск ждёт согласования безопасности"
    details: "Прогноз отдают закупщикам через REST-сервис в Kubernetes, пересчёт выполняется каждую ночь. Сервис работает в тестовой среде, для прода нужно согласование сетевого доступа со службой безопасности. Требование к времени ответа — до 300 миллисекунд. Плановая дата запуска — 1 декабря, ответственный — MLOps-инженер Паша."
  - id: "c09"
    name: "Сбор признаков погоды и праздников"
    status: "источник погоды подключён, календарь региональных праздников пока ведётся вручную"
    details: "Для модели спроса добавляют внешние признаки: погоду и региональные праздники. Погоду забирают у внешнего провайдера по API раз в сутки, договор стоит 120 тысяч рублей в год. Календарь региональных праздников аналитик Вера пока ведёт вручную в таблице. Автоматизировать календарь планируют до февраля."

  # --- Кластер «Доступы» ---
  - id: "c10"
    name: "Доступ к API складской системы"
    status: "тестовый токен от Кедр-Логистик получен, боевой выдадут после подписания допсоглашения"
    details: "Для интеграции с системой подрядчика Кедр-Логистик нужен авторизационный токен. Тестовый токен живёт 90 дней, ограничение — 100 запросов в минуту. Боевой токен выдадут после подписания дополнительного соглашения к договору. Хранить токен решили в Vault, а не в переменных Airflow."
  - id: "c11"
    name: "Ролевая модель доступа к хранилищу"
    status: "черновик матрицы ролей готов, открыт спор о доступе аналитиков к сырому слою"
    details: "Вместо персональной выдачи прав вводят пять ролей: аналитик, дата-инженер, data scientist, бизнес-пользователь и администратор. Спорный вопрос — давать ли аналитикам чтение сырого слоя raw, архитектор против. Роли синхронизируются с группами корпоративного каталога пользователей. Срок внедрения — конец квартала."
  - id: "c12"
    name: "Квартальный пересмотр прав пользователей"
    status: "выгружено 1400 учётных записей, руководителям разосланы списки на подтверждение"
    details: "Раз в квартал по требованию аудиторов руководители подтверждают права своих сотрудников в хранилище и BI. В этот раз выгрузили 1400 учётных записей, около 200 из них принадлежат уволенным или переведённым. Неподтверждённые права отзываются автоматически через 14 дней. Процесс ведёт Лена из команды платформы."

  # --- Кластер «Люди» ---
  - id: "c13"
    name: "Закрытие вакансий дата-инженеров"
    status: "проведено 9 интервью, одному кандидату сделан оффер, вторая ставка пока открыта"
    details: "Команде платформы одобрили две ставки инженеров данных уровня middle+. Вилка — до 350 тысяч рублей на руки, рекрутер считает, что рынок выше. Проведено 9 технических интервью, одному кандидату сделан оффер, ответ ждут до пятницы. Если вторую ставку не закрыть до нового года, её могут забрать в следующем бюджете."
  - id: "c14"
    name: "Онбординг новых сотрудников платформы"
    status: "чек-лист первой недели готов, выдача доступов новичкам всё ещё занимает больше пяти дней"
    details: "Для новичков подготовили чек-лист первой недели и назначают наставника на три месяца. Главная проблема — выдача доступов занимает в среднем пять-семь рабочих дней. Решили заводить заявки на доступы за неделю до выхода человека. Первая задача новичка — исправить небольшой DAG из списка good first issue."
  - id: "c15"
    name: "Летняя стажировка для студентов"
    status: "договорились с двумя вузами, отбор стажёров начнётся в марте, ищем трёх наставников"
    details: "Летом планируют взять четырёх стажёров на три месяца с оплатой 60 тысяч рублей в месяц. С двумя университетами договорились о размещении вакансии. Отбор — тестовое задание на SQL и Python в марте, затем интервью. Нужно найти трёх наставников среди senior-инженеров."

  # --- Кластер «Деньги и железо» ---
  - id: "c16"
    name: "Закупка серверов под новый кластер"
    status: "спецификация на 8 узлов согласована, поставка сдвинулась с декабря на февраль"
    details: "Под аналитические нагрузки закупают 8 узлов по 64 ядра и 512 гигабайт памяти. Стоимость — около 24 миллионов рублей, бюджет утверждён финансовым директором. Поставщик сдвинул поставку с декабря на февраль из-за проблем с логистикой. До поставки команда использует облачные мощности."
  - id: "c17"
    name: "Бюджет на облако на следующий год"
    status: "финансы урезали заявку на облако на 30%, ищем источники экономии к бюджетному комитету"
    details: "Заявка команды на ресурсы в облаке «Сосна» на следующий год — 18 миллионов рублей. Финансы урезали её на 30%, до 12,6 миллиона. Варианты экономии — выключать тестовые стенды на ночь и выходные и перевести холодные данные в дешёвый класс хранения. Итоговую цифру защищают на бюджетном комитете 12 декабря."
  - id: "c18"
    name: "Замена платного BI на Superset"
    status: "лицензии истекают в марте, пилот Superset переносит 70% дашбордов без доработок"
    details: "Лицензии коммерческого BI на 250 пользователей стоят 9 миллионов рублей в год и истекают в марте. Пилот на Superset показал, что 70% дашбордов переносятся без доработок. Главная проблема — сложные отчёты финансового отдела с многоуровневыми сводными таблицами. Решение о продлении или отказе нужно принять до 1 февраля."

  # --- Подрядчики ---
  - id: "c19"
    name: "Договор с подрядчиком Кедр-Логистик"
    status: "согласовываем допсоглашение об обмене данными, открыты вопросы по персональным данным и SLA"
    details: "С логистическим подрядчиком Кедр-Логистик заключают допсоглашение на обмен данными о поставках. Юристы требуют добавить пункт об обработке персональных данных водителей. Подрядчик просит SLA доступности нашего API 99,5%, команда готова дать 99%. Подписание планируется до 15 ноября."
  - id: "c20"
    name: "Продление поддержки PostgreSQL у вендора"
    status: "вендор поднял стоимость поддержки на 40%, рассматриваем отказ в пользу своего DBA"
    details: "Коммерческая поддержка PostgreSQL от компании «Полярный софт» дорожает с 3 до 4,2 миллиона рублей в год. Альтернатива — нанять своего DBA и обходиться без внешнего контракта. За прошлый год было всего 6 обращений в поддержку, два из них критичные. Решение нужно до окончания текущего контракта 31 декабря."

  # --- Качество данных ---
  - id: "c21"
    name: "Автоматические проверки качества данных"
    status: "проверки подключены к 5 витринам из 40, около трети алертов оказываются ложными"
    details: "Проверки на Great Expectations запускаются в Airflow после каждой загрузки витрин. Покрыто 5 витрин из 40, около трети алертов оказываются ложными. Решили начать с простых правил: полнота, уникальность ключей и свежесть данных. Цель — 20 покрытых витрин к концу квартала."
  - id: "c22"
    name: "Расхождение выручки между отчётами"
    status: "выручка в BI на 2% выше учётной системы из-за разного учёта бонусных скидок"
    details: "Финансовый директор заметил, что выручка за сентябрь в BI на 2% выше, чем в учётной системе. Причина — витрина считает выручку до вычета бонусных скидок программы лояльности. Решили завести единое определение метрики в каталоге и пересчитать витрину. Ответственная — аналитик Вера, срок — до закрытия октября."
  - id: "c23"
    name: "Дубли в справочнике товаров"
    status: "найдено около 12 тысяч дублей, правила слияния согласуются с отделом мастер-данных"
    details: "В справочнике номенклатуры нашли около 12 тысяч дублей: один товар заведён разными поставщиками под разными кодами. Из-за этого остатки и продажи по позиции размазаны. Автоматическое сопоставление по штрихкоду покрывает 70% случаев, правила слияния согласуют с отделом мастер-данных. Остальное вручную разбирают категорийные менеджеры."

  # --- Безопасность ---
  - id: "c24"
    name: "Внешний аудит информационной безопасности"
    status: "аудитор запросил журналы доступа за полгода, материалы нужно сдать до 30 ноября"
    details: "Внешний аудитор проверяет хранилище на соответствие требованиям ИБ перед сертификацией. Запрошены журналы доступа за шесть месяцев и описание процесса выдачи прав. Слабое место — 37 сервисных учётных записей с бессрочными паролями. Материалы нужно предоставить до 30 ноября, координирует Лена."
  - id: "c25"
    name: "Маскирование персональных данных в тесте"
    status: "ФИО, телефоны и почта маскируются, адреса и паспортные данные пока копируются как есть"
    details: "Копия продуктивных данных в тестовой среде должна быть обезличена по требованию службы безопасности. Сейчас маскируются ФИО, телефоны и email, а адреса доставки и паспортные данные из программы лояльности копируются как есть. Решили использовать детерминированное хеширование, чтобы сохранялись связи между таблицами. Срок — до следующего копирования в декабре."

  # --- Релизы ---
  - id: "c26"
    name: "Релиз версии 3.0 платформы данных"
    status: "релиз перенесён на неделю из-за регрессии в загрузчике, новая дата — 18 ноября"
    details: "Версия 3.0 включает новый загрузчик из Kafka, переход на Airflow 2.9 и обновлённый каталог. На регрессионном тестировании загрузчик терял сообщения при перебалансировке консьюмеров. Релиз перенесли с 11 на 18 ноября. Установка — в ночь с субботы на воскресенье, план отката готовит Тимур."
  - id: "c27"
    name: "Переход на GitLab CI для DAG-ов"
    status: "проверки на каждый merge request работают, деплой в прод пока выполняется вручную"
    details: "DAG-и Airflow собирают в единый репозиторий с автоматической проверкой: линтер, юнит-тесты и проверка импорта. Деплой в прод сейчас делают копированием файлов на сервер, его заменят автодеплоем по мерджу в main. Обязательное ревью — минимум один аппрув от другой команды. Срок — конец квартала, ведёт Паша."
  - id: "c28"
    name: "Заморозка изменений перед новогодним сезоном"
    status: "мораторий на изменения в проде с 15 декабря по 10 января, исключения только через тимлида"
    details: "На пик продаж с 15 декабря по 10 января вводится запрет на любые изменения в продуктивной среде. Исключения — только критичные исправления с согласия тимлида и дежурного. Все запланированные релизы нужно выкатить до 12 декабря. Праздничные дежурства распределяют отдельно."

  # --- Документация и процессы ---
  - id: "c29"
    name: "Каталог данных и описания витрин"
    status: "описано 120 таблиц из 400, у всех витрин верхнего слоя назначены владельцы"
    details: "Каталог данных на OpenMetadata заполняют описаниями таблиц и полей. Описано 120 таблиц из 400, у всех витрин верхнего слоя есть владельцы. Решили, что новая витрина без описания полей не проходит ревью. Ответственная за каталог — Марина."
  - id: "c30"
    name: "Регламент дежурств команды платформы"
    status: "недельные смены согласованы, компенсация за ночные выходы пока не утверждена HR"
    details: "Дежурство — недельная смена одного инженера с резервным вторым. Время реакции на критичный инцидент — 30 минут круглосуточно. Компенсация за ночные выходы не согласована с HR, обсуждается доплата 5 тысяч рублей за неделю. Расписание ведётся в общем календаре."
  - id: "c31"
    name: "Ежемесячный дашборд для правления"
    status: "макет согласован с финансовым директором, автоматическая сборка данных пока не готова"
    details: "Правлению раз в месяц нужен один экран с ключевыми метриками: выручка, маржа, трафик, средний чек и доля онлайна. Сейчас отчёт собирают вручную в презентации за два рабочих дня. Цель — автоматическое обновление к 5-му числу месяца. Макет утвердил финансовый директор, разработку ведёт аналитик Вера."
  - id: "c32"
    name: "Анализ эффективности программы лояльности"
    status: "держатели карты тратят на 22% больше, но эффект может быть смещён, готовим A/B-тест"
    details: "Маркетинг попросил оценить, окупаются ли бонусы программы лояльности. Простое сравнение показывает, что держатели карты тратят на 22% больше, но это может быть эффект самоотбора. Решили провести A/B-тест в 20 магазинах, не начисляя бонусы части новых клиентов. Результаты ждут к концу первого квартала."
  - id: "c33"
    name: "Переезд команды в новый офис"
    status: "переезд назначен на последнюю неделю ноября, рабочих мест на 15% меньше, чем людей"
    details: "Команда переезжает в новый бизнес-центр в последнюю неделю ноября. Рабочих мест будет на 15% меньше, чем сотрудников, поэтому вводится бронирование столов. Стойка тестового стенда остаётся на старом месте до весны. Ответственная от команды — Ксения."
  - id: "c34"
    name: "Новогодний корпоратив отдела"
    status: "бюджет 4 тысячи рублей на человека, голосование за формат праздника идёт до пятницы"
    details: "На новогодний праздник выделено 4 тысячи рублей на человека, в отделе 38 человек. Варианты — квест-комната с ужином или банкет в ресторане, голосование до пятницы. Дата — 26 декабря, после обеда рабочий день сокращённый. Организует Ксения."
  - id: "c35"
    name: "Гибридный график работы команды"
    status: "согласовано три дня в офисе и два удалённо, общие встречи — во вторник и четверг"
    details: "С декабря вводится гибридный режим: три дня в офисе и два дня удалённо. Обязательные офисные дни — вторник и четверг, на них переносят планирование и ретро. Дежурным в неделю смены разрешено работать полностью удалённо. Исключения согласует руководитель направления."
  - id: "c36"
    name: "Формат ретроспектив и длина спринта"
    status: "с января спринты длиной три недели, ретро проводим анонимно через онлайн-доску"
    details: "Двухнедельные спринты не вмещают задачи миграции, поэтому с января переходят на трёхнедельные итерации. Ретроспективы проходят через анонимную онлайн-доску, ведущий меняется каждый раз. Пункты действий из ретро заводят в Jira с владельцем. Ведущий первой ретро в новом формате — Ильдар."
  - id: "c37"
    name: "Приоритизация запросов бизнеса на витрины"
    status: "в очереди 47 запросов, введена оценка ценности и трудоёмкости, комитет раз в две недели"
    details: "Очередь запросов от бизнес-подразделений выросла до 47, многие ждут больше трёх месяцев. Ввели оценку по ценности и трудоёмкости, раз в две недели её пересматривает комитет из продакта, тимлида и архитектора. Запросы без заказчика и цели больше не принимаются. Владелец процесса — продакт-менеджер Арсений."

  # --- Пайплайны и инфраструктура ---
  - id: "c38"
    name: "Загрузка чеков из кассовых систем"
    status: "задержка поступления чеков сократилась до 40 минут, 6 магазинов отдают данные раз в сутки"
    details: "Чеки из 210 магазинов поступают в хранилище через промежуточный сервер файлового обмена. После доработки средняя задержка сократилась с 4 часов до 40 минут. В шести магазинах со старым кассовым ПО данные приходят раз в сутки, обновление ПО запланировано на весну. Владелец потока — Олег."
  - id: "c39"
    name: "Витрина складских остатков для логистики"
    status: "витрина пересчитывается раз в час, логисты просят обновление каждые 15 минут"
    details: "Витрина остатков по 4 распределительным центрам пересчитывается раз в час, логисты по ней планируют машины. Логисты просят обновление каждые 15 минут, для этого нужен потоковый расчёт. Оценка — 6 недель работы двух инженеров. Решение отложили до запуска нового кластера."
  - id: "c40"
    name: "Охлаждение исторических данных в S3"
    status: "данные старше трёх лет вынесены в S3, место в хранилище сократилось примерно на 35%"
    details: "Данные старше трёх лет переносят в объектное хранилище S3 и читают через внешние таблицы. Перенесено 60 терабайт, занятое место в хранилище сократилось на 35%. Запросы к старым данным стали медленнее в 5-8 раз, аналитиков предупредили. Следующий этап — автоматическое перемещение партиций по расписанию."
  - id: "c41"
    name: "Ускорение расчёта клиентской витрины"
    status: "ночной расчёт сокращён с 6 до 2,5 часов, осталась проблема перекоса данных по ключу"
    details: "Клиентская витрина на 40 миллионов строк каждую ночь пересчитывалась целиком и занимала 6 часов. Переход на инкрементальную загрузку изменённых записей сократил время до 2,5 часов. Осталась проблема перекоса данных по одному ключу распределения. Дальнейшую оптимизацию ведёт Ильдар."
  - id: "c42"
    name: "Обновление Airflow до версии 2.9"
    status: "тестовый стенд обновлён, 30 DAG-ов из 180 нужно переписать из-за устаревших операторов"
    details: "Airflow обновляют с версии 1.10 до 2.9, поддержка старой версии давно прекращена. Из 180 DAG-ов около 30 используют устаревшие операторы и требуют переписывания. Обновление продуктивного Airflow войдёт в релиз 3.0 платформы. Переписывание DAG-ов распределили между тремя инженерами."
  - id: "c43"
    name: "Резервное копирование служебных баз PostgreSQL"
    status: "бэкапы делаются ежедневно, но восстановление не проверялось, тест назначен на субботу"
    details: "Служебные базы PostgreSQL (метаданные Airflow, каталог, BI) ежедневно бэкапятся в S3 и хранятся 14 дней. Восстановление из бэкапа никто не проверял больше года, тестовое восстановление назначено на субботу. Ожидаемое время восстановления — около 2 часов. Ночной бэкап решили перенести на 01:00, чтобы не мешать загрузке из Kafka."
  - id: "c44"
    name: "Кластер Kubernetes для аналитических сервисов"
    status: "кластер из 6 узлов развёрнут, первыми переезжают Superset и сервис прогноза спроса"
    details: "Для аналитических сервисов развёрнут отдельный кластер Kubernetes из 6 узлов. Первыми туда переезжают Superset, сервис прогноза спроса и JupyterHub. Конфигурацией управляют через GitOps с Argo CD, ручные изменения запрещены. Администрирует кластер инженер инфраструктуры Гоша."
  - id: "c45"
    name: "Шаблон постмортема после инцидентов"
    status: "утверждён единый шаблон разбора, разбор проводится в течение 5 рабочих дней без поиска виноватых"
    details: "После каждого инцидента первого и второго уровня в течение пяти рабочих дней проводится разбор по единому шаблону. Разбор идёт без поиска виноватых, итог — список действий с владельцами и сроками. Первым по новому шаблону разобрали ночные падения потока заказов. Разборы хранятся в базе знаний в разделе платформы."


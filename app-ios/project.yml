# XcodeGen-описание iOS-приложения: `xcodegen generate` в этой папке →
# CharoiteiOS.xcodeproj. Подпись и iCloud-контейнер добавляются в Xcode
# (Signing & Capabilities: команда разработчика + iCloud Documents).
#
# DEVELOPMENT_TEAM берётся из окружения — свой Team ID здесь не хранится.
# У индивидуального аккаунта Apple имя команды это юридическое имя владельца,
# а репозиторий обезличен; заодно чужой Team ID не ломал бы сборку контрибьютору.
#   export DEVELOPMENT_TEAM=XXXXXXXXXX && xcodegen generate
# Для CI подпись не нужна вовсе: xcodebuild ... CODE_SIGNING_ALLOWED=NO.
name: CharoiteiOS
options:
  bundleIdPrefix: ai.charoite
  deploymentTarget:
    iOS: "17.0"
targets:
  CharoiteiOS:
    type: application
    platform: iOS
    sources: [Sources/CharoiteiOS, Sources/Shared, Assets.xcassets]
    dependencies:
      - target: CharoiteWidgets
        embed: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Charoite
        NSMicrophoneUsageDescription: >-
          Микрофон нужен для записи встреч и голосовых заметок. Файлы
          обрабатываются на вашем Mac; в облако сервисов ничего не уходит.
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        # Запись должна доставаться руками, без iCloud и без Mac: через
        # «Файлы» на самом телефоне и по кабелю (AFC). 03.08 очередь в
        # Documents была единственным экземпляром встречи, и достать её
        # было нечем — приложение не отдавало папку наружу.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Версия и номер сборки — из настроек таргета (ниже), а не литералы:
        # xcodegen сам пишет в plist «1.0»/«1», и телефон показывал бы их
        # (проверено сборкой на симуляторе, GLM r1 по #500); у приложения
        # и виджета пара обязана совпадать, App Store требует роста номера
        # сборки на каждую загрузку.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Стандартное шифрование (HTTPS) — экспортных ограничений нет; без
        # этого ключа каждый TestFlight-билд ждёт ручного ответа в ASC.
        ITSAppUsesNonExemptEncryption: false
        # NSUbiquitousContainers убран 03.08: собственный iCloud-контейнер
        # приложения (iCloud.ai.charoite.inbox) в доставке не участвует с
        # 27.07 — он неделями не материализовался на Mac, и доставка ушла в
        # обычный iCloud Drive через выбранную пользователем папку. Пустые
        # entitlements контейнер и так не подключали; блок только обещал в
        # «Файлах» папку, которой нет.
    entitlements:
      path: CharoiteiOS.entitlements
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.70.0" # x-release-please-version
        CURRENT_PROJECT_VERSION: "6"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CharoiteWidgets:
    type: app-extension
    platform: iOS
    sources: [Sources/CharoiteWidgets, Sources/Shared]
    info:
      path: WidgetsInfo.plist
      properties:
        CFBundleDisplayName: Charoite
        CFBundleShortVersionString: $(MARKETING_VERSION)   # та же пара, что у приложения
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: "6"
        # WidgetKit-расширение обязано жить в bundle приложения
        PRODUCT_BUNDLE_IDENTIFIER: ai.charoite.CharoiteiOS.widgets
        MARKETING_VERSION: "0.70.0" # x-release-please-version
  CharoiteiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/CharoiteiOSTests]
    dependencies:
      - target: CharoiteiOS
    settings:
      base:
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        GENERATE_INFOPLIST_FILE: YES
  CharoiteiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/CharoiteiOSUITests]
    dependencies:
      - target: CharoiteiOS
    settings:
      base:
        TEST_TARGET_NAME: CharoiteiOS
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CharoiteiOS:
    build:
      targets: {CharoiteiOS: all, CharoiteiOSTests: [test], CharoiteiOSUITests: [test]}
    run: {config: Debug}
    test:
      config: Debug
      targets: [CharoiteiOSTests, CharoiteiOSUITests]

# Локальные проверки до коммита: pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--select, "E9,F"]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
  - repo: local
    hooks:
      - id: swiftlint
        name: swiftlint (errors)
        entry: bash -c 'swiftlint lint --quiet | grep error && exit 1 || exit 0'
        language: system
        files: \.swift$
        pass_filenames: false
      # Страж обезличивания: раньше жил в .git/hooks и не переносился с
      # репозиторием — на новой машине защиты не было вовсе.
      - id: private-markers
        name: приватные маркеры (обезличивание публичного репо)
        entry: python3 scripts/check_private_markers.py
        language: system
        pass_filenames: false
        always_run: true

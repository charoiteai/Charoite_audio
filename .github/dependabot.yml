# Dependabot: версии зависимостей — еженедельно, тихими PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: swift
    directory: /app
    schedule: {interval: weekly}
  - package-ecosystem: gradle
    directory: /app-android
    schedule: {interval: weekly}

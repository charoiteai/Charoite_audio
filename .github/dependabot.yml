# Dependabot: версии зависимостей — еженедельно, тихими PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  # pip — самая большая поверхность проекта (onnxruntime, requests,
  # websockets…); без этой секции за её CVE следил только dependency-review
  # на PR, которых без dependabot не возникает (аудит 14.08)
  # pip видит и pyproject (диапазоны), и requirements-runtime.lock
  # (пины с хешами — то, что реально уезжает в бандл пользователям).
  # При обновлении lock пересобирается: scripts/lock_runtime_deps.py
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
  # У отдельно собираемого пакета графа свой манифест.
  - package-ecosystem: pip
    directory: /packages/charoite-graph
    schedule: {interval: weekly}
  # Девлог исполняет Ruby-зависимости в GitHub Actions.
  - package-ecosystem: bundler
    directory: /devlog
    schedule: {interval: weekly}
  - package-ecosystem: swift
    directory: /app
    schedule: {interval: weekly}
  - package-ecosystem: gradle
    directory: /app-android
    schedule: {interval: weekly}

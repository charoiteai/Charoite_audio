# Требует обновлять документацию вместе с кодом.
#
# Ловит ровно случай «код починил, доку забыл»: если PR трогает src/**, но
# не трогает docs/**, README* или CHANGELOG — падает. Обойти осознанно можно
# меткой skip-docs на PR (например, чистый рефакторинг без смысловых правок).
#
# Безопасность: имена файлов из git и метку из события НЕ подставляем в
# оболочку интерполяцией — читаем через переменные окружения (иначе имя
# ветки или файла может нести инъекцию, см. github.blog про workflow injection).
name: docs-guard

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  docs-updated:
    runs-on: ubuntu-latest
    # release-please вешает ярлык «autorelease: tagged» на уже слитый PR —
    # событие labeled приходит, когда ветки и её head-коммита больше нет,
    # и git diff base...head падает (23.08, PR #389). Слитый PR не проверяем.
    if: github.event.pull_request.merged == false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0   # нужен merge-base для диапазона изменений

      - name: Документация обновлена вместе с кодом?
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # запятыми-разделённый список меток PR — читаем как данные, не как код
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          # осознанный обход: метка skip-docs
          case ",$PR_LABELS," in
            *,skip-docs,*)
              echo "Метка skip-docs — проверка пропущена."
              exit 0 ;;
          esac

          # Три точки, а не две: сравнение с точкой ветвления, а не с текущим
          # состоянием main. С двумя точками чужой коммит в main показывался
          # как изменение этого PR — и страж то пропускал PR без документации
          # (в diff случайно попадал README из main), то требовал её у PR,
          # который кода не касался.
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"

          # Релизный PR release-please: версия, манифест, CHANGELOG и бамп
          # MARKETING_VERSION в app-ios/project.yml (generic-updater с #500) —
          # документировать нечего. Пропуск — по СОСТАВУ диффа, а не по имени
          # ветки: появится новый extra-file — страж покраснеет и заставит
          # вписать его сюда осознанно, а не замолчит (GLM r1 по PR #503).
          release_only="$(echo "$changed" | grep -vE '^(CHANGELOG\.md|\.github/\.release-please-manifest\.json|app-ios/project\.yml)$' || true)"
          if [ -n "$changed" ] && [ -z "$release_only" ]; then
            echo "Только релизные файлы (версия, манифест, CHANGELOG) — документировать нечего."
            exit 0
          fi

          # Кодом считается весь код, а не только Python: приложение на 4400
          # строк Swift раньше можно было переписать целиком, и страж молчал.
          touches_code="$(echo "$changed" | grep -E '^(src/|app/|app-ios/|app-android/|scripts/)' || true)"
          # Поднятая версия зависимости — не изменение поведения, и требовать
          # под неё абзац в README значит либо плодить пустые абзацы, либо
          # держать вечно красным каждый PR бота. Сам код при этом под стражем.
          # Сюда же вся обёртка gradle: dependabot при поднятии версии меняет
          # не только .properties, но и gradlew, gradlew.bat и сам .jar —
          # то есть страж краснел на каждом таком PR (12.08, #270), хотя
          # поведения продукта эти файлы не касаются и абзаца в README не
          # заслуживают. Обходить это меткой руками каждый раз — способ
          # приучить ставить skip-docs не глядя, а вот это уже опасно.
          touches_code="$(echo "$touches_code" | grep -vE '(^|/)(libs\.versions\.toml|gradle-wrapper\.properties|gradle-wrapper\.jar|gradlew|gradlew\.bat|Package\.resolved)$' || true)"
          # Документацией — только то, что человек правда читает как документацию.
          # Переводы (README.zh.md и прочие) из списка убраны: опечатка в
          # китайском переводе закрывала требование задокументировать демон.
          # CHANGELOG убран тоже — docs/RELEASING.md запрещает править его руками.
          touches_docs="$(echo "$changed" | grep -E '^(docs/|(app|app-ios|app-android|scripts)/README\.md$|README\.md$|PRIVACY\.md$|SECURITY\.md$|ROADMAP\.md$|CONTRIBUTING\.md$)' || true)"

          if [ -n "$touches_code" ] && [ -z "$touches_docs" ]; then
            echo "::error::Изменён код, но не тронута документация."
            echo ""
            echo "Обнови docs/ или README* (CHANGELOG.md ведёт release-please) — либо повесь метку skip-docs,"
            echo "если правка чисто техническая и документировать нечего."
            echo ""
            echo "Изменённые файлы:"
            echo "$changed" | sed 's/^/  /'
            exit 1
          fi

          echo "Документация в порядке."

# Требует обновлять документацию вместе с кодом.
#
# Ловит ровно случай «код починил, доку забыл»: если PR трогает src/**, но
# не трогает docs/**, README* или CHANGELOG — падает. Обойти осознанно можно
# меткой skip-docs на PR (например, чистый рефакторинг без смысловых правок).
#
# Безопасность: имена файлов из git и метку из события НЕ подставляем в
# оболочку интерполяцией — читаем через переменные окружения (иначе имя
# ветки или файла может нести инъекцию, см. github.blog про workflow injection).
name: docs-guard

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  docs-updated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # нужен merge-base для диапазона изменений

      - name: Документация обновлена вместе с кодом?
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # запятыми-разделённый список меток PR — читаем как данные, не как код
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          # осознанный обход: метка skip-docs
          case ",$PR_LABELS," in
            *,skip-docs,*)
              echo "Метка skip-docs — проверка пропущена."
              exit 0 ;;
          esac

          # Три точки, а не две: сравнение с точкой ветвления, а не с текущим
          # состоянием main. С двумя точками чужой коммит в main показывался
          # как изменение этого PR — и страж то пропускал PR без документации
          # (в diff случайно попадал README из main), то требовал её у PR,
          # который кода не касался.
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"

          # Кодом считается весь код, а не только Python: приложение на 4400
          # строк Swift раньше можно было переписать целиком, и страж молчал.
          touches_code="$(echo "$changed" | grep -E '^(src/|app/|app-ios/|app-android/|scripts/)' || true)"
          # Документацией — только то, что человек правда читает как документацию.
          # Переводы (README.zh.md и прочие) из списка убраны: опечатка в
          # китайском переводе закрывала требование задокументировать демон.
          # CHANGELOG убран тоже — docs/RELEASING.md запрещает править его руками.
          touches_docs="$(echo "$changed" | grep -E '^(docs/|app-android/README\.md$|README\.md$|PRIVACY\.md$|SECURITY\.md$|ROADMAP\.md$|CONTRIBUTING\.md$)' || true)"

          if [ -n "$touches_code" ] && [ -z "$touches_docs" ]; then
            echo "::error::Изменён код, но не тронута документация."
            echo ""
            echo "Обнови docs/, README* или CHANGELOG.md — либо повесь метку skip-docs,"
            echo "если правка чисто техническая и документировать нечего."
            echo ""
            echo "Изменённые файлы:"
            echo "$changed" | sed 's/^/  /'
            exit 1
          fi

          echo "Документация в порядке."

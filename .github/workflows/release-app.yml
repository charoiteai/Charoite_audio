# Готовый Charoite.app к каждому релизу: пользователи скачивают DMG/zip,
# а не собирают Swift сами.
#
# Подпись и нотаризация — по наличию секретов (см. docs/RELEASING.md):
#   APPLE_DEVELOPER_ID_P12 (base64 .p12) + APPLE_DEVELOPER_ID_P12_PASSWORD
#     → Developer ID Application, hardened runtime, метка времени;
#   APPLE_NOTARY_KEY_P8 (base64 ключа App Store Connect API) +
#   APPLE_NOTARY_KEY_ID + APPLE_NOTARY_ISSUER_ID
#     → notarytool submit --wait + stapler staple на .app и .dmg.
# Секретов нет → сборка ad-hoc, как раньше: первый запуск через
# «Открыть всё равно» в настройках macOS, см. README. Конвейер от этого не
# краснеет — он честно пишет режим в лог.
#
# Порядок жёсткий: СНАЧАЛА выясняем, какому релизу нужен ассет, ПОТОМ
# собираем — и собираем checkout ТЕГА, а не вершину main. Урок v0.19.0:
# сборка main прикрепилась к старому тегу, и «0.19.0» скачивался с кодом
# новее релиза (подробности — docs/RELEASING.md).
name: release-app

# release-please публикует релиз через GITHUB_TOKEN, а такие события НЕ
# запускают другие workflows (защита GitHub от рекурсии) — поэтому цепочка
# workflow_run: она от GITHUB_TOKEN срабатывает. Ручной release: published
# оставлен для релизов, созданных человеком. workflow_dispatch — дозаливка
# ассета старому релизу с его собственного тега (например, v0.19.0).
on:
  release:
    types: [published]
  # zizmor: ignore[dangerous-triggers]
  # Триггер опасен, когда слушает чужие workflow: код запускается с правами
  # основного репозитория. Здесь источник ровно один и наш собственный —
  # release-please из этого же репозитория, форки его не запускают. Без
  # workflow_run бандл к релизу не прикладывался бы вовсе (см. выше).
  workflow_run:
    workflows: [release-please]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, которому пересобрать и перезалить Charoite.app.zip"
        required: true
        type: string

permissions:
  contents: write

# Не отменять: прерванная на середине заливка хуже, чем очередь из двух.
concurrency:
  group: release-app
  cancel-in-progress: false

jobs:
  build-app:
    name: build and attach Charoite.app
    # macos-15: тот же SDK, что и в swift-tests — API микрофона
    # ScreenCaptureKit не компилируется на 14.
    runs-on: macos-15
    # Нотаризация ждёт Apple: обычно минуты, в плохой день — десятки.
    timeout-minutes: 60
    env:
      # Флаги режима — булевы строки, не сами секреты: значения секретов
      # уходят только в env конкретных шагов, где они нужны.
      SIGNING: ${{ secrets.APPLE_DEVELOPER_ID_P12 != '' && secrets.APPLE_DEVELOPER_ID_P12_PASSWORD != '' }}
      NOTARY: ${{ secrets.APPLE_NOTARY_KEY_P8 != '' && secrets.APPLE_NOTARY_KEY_ID != '' && secrets.APPLE_NOTARY_ISSUER_ID != '' }}
    # workflow_run: types: [completed] приходит и после УПАВШЕГО
    # release-please — собирать по нему нечего.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      # Тег и «надо ли вообще» — до сборки. release-please завершается на
      # каждый пуш в main, чаще всего не создав релиза: у свежайшего релиза
      # ассет уже есть, и весь прогон заканчивается на этом шаге за секунды,
      # а не после полной macOS-сборки.
      - name: Resolve tag and decide
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          # workflow_run: тега в событии нет — берём свежайший релиз
          if [ -z "$TAG" ]; then
            # --exclude-drafts: у черновика есть tagName, но НЕТ git-тега —
            # checkout такого «тега» красил бы прогон, пока жив драфт
            TAG=$(gh release list --repo "$REPO" --exclude-drafts --limit 1 --json tagName -q '.[0].tagName')
          fi
          if [ -z "$TAG" ]; then
            echo "релизов нет — нечего прикладывать"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # ручной запуск пересобирает всегда (--clobber заменит кривой ассет);
          # автоматический — только если ассета ещё нет
          if [ "$EVENT_NAME" != "workflow_dispatch" ] \
            && gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name' \
                 | grep -qx 'Charoite.dmg'; then
            echo "у $TAG уже есть артефакт — сборка не нужна"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      # Собираем КОД ТЕГА. make_app.sh штампует версию из git describe —
      # на checkout тега это ровно сам тег, Info.plist совпадает с релизом.
      # SHA-пин: workflow держит contents: write и собирает то, что
      # уезжает пользователям (аудит 16.08). Остальные workflow
      # read-only — там ref-pin остаётся осознанным (.github/zizmor.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        if: steps.resolve.outputs.build == 'true'
        with:
          persist-credentials: false
          ref: refs/tags/${{ steps.resolve.outputs.tag }}
          fetch-depth: 0   # вся история + теги, иначе git describe слепнет
      # Кэш сборки здесь убран осознанно: релизный бинарь мы подписываем
      # и раздаём людям, а восстановленный кэш — это чужие артефакты в
      # нашей поставке (zizmor: cache-poisoning). Релиз идёт раз в выпуск,
      # лишние минуты сборки дешевле такого риска.
      - name: Build embedded python runtime
        # Условие как у соседей: без него шаг выполнялся ВСЕГДА, в том числе
        # когда собирать нечего — а checkout тега под тем же условием не
        # выполнялся, и шаг падал на отсутствующем файле. release-app краснел
        # на каждом пуше в main, приучая не смотреть на красное (аудит 0.46.0).
        if: steps.resolve.outputs.build == 'true'
        run: ./scripts/build_embedded_python.sh
      # Сертификат — во ВРЕМЕННУЮ связку с паролем на один прогон; в конце
      # (always) связка удаляется. Имя владельца сертификата в лог не
      # печатаем: логи публичного репозитория читают все, а подпись и так
      # покажет его тем, кому нужно (codesign -dv).
      - name: Import Developer ID certificate
        if: steps.resolve.outputs.build == 'true' && env.SIGNING == 'true'
        env:
          P12_B64: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/charoite-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PW"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          printf '%s' "$P12_B64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/developer-id.p12"
          # codesign не должен спрашивать пароль в неинтерактивном прогоне
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          # временная связка — в список поиска, иначе find-identity её не видит
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "в APPLE_DEVELOPER_ID_P12 нет сертификата Developer ID Application" >&2
            exit 1
          fi
          # имя идентичности — скриптам сборки через env, не в лог
          echo "CHAROITE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "CHAROITE_SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "сертификат Developer ID Application импортирован во временную связку"
      - name: Signing mode
        if: steps.resolve.outputs.build == 'true'
        run: |
          if [ "$SIGNING" = "true" ] && [ "$NOTARY" = "true" ]; then
            echo "режим: Developer ID + hardened runtime + нотаризация"
          elif [ "$SIGNING" = "true" ]; then
            echo "::warning::сертификат есть, а секретов нотаризации нет — сборка подписана, но Gatekeeper всё равно потребует «Открыть всё равно». Добавьте APPLE_NOTARY_KEY_P8 / _KEY_ID / _ISSUER_ID."
          else
            echo "::notice::секретов подписи нет — сборка ad-hoc, первый запуск через «Открыть всё равно» (docs/RELEASING.md, раздел «Подпись»)."
          fi
      - name: Build bundle
        if: steps.resolve.outputs.build == 'true'
        working-directory: app
        run: ./make_app.sh
      - name: Zip
        if: steps.resolve.outputs.build == 'true'
        working-directory: app/build
        run: ditto -c -k --keepParent Charoite.app Charoite.app.zip
      # Нотаризация приложения — ДО сборки DMG: прошитый (stapled) бандл
      # должен лежать и внутри образа, и внутри zip, которым обновляется
      # установленное приложение — иначе оффлайн-запуск после обновления
      # упрётся в Gatekeeper. Поэтому zip после staple пересобирается.
      - name: Notarize and staple app
        if: steps.resolve.outputs.build == 'true' && env.SIGNING == 'true' && env.NOTARY == 'true'
        env:
          NOTARY_KEY_B64: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/notary-key.p8"
          umask 077
          printf '%s' "$NOTARY_KEY_B64" | base64 --decode > "$KEY"
          ./scripts/notarize.sh app/build/Charoite.app.zip app/build/Charoite.app \
            "$KEY" "$NOTARY_KEY_ID" "$NOTARY_ISSUER_ID"
          # zip — заново, уже с прошитым бандлом
          rm -f app/build/Charoite.app.zip
          (cd app/build && ditto -c -k --keepParent Charoite.app Charoite.app.zip)
      # DMG — для первой установки: окно с приложением и стрелкой в
      # «Программы». Из zip половина пользователей запускает приложение прямо
      # из «Загрузок», а оттуда оно теряет выданные права при первой же
      # чистке папки. Zip при этом остаётся: им обновляется уже
      # установленное приложение, распаковка не требует монтирования тома.
      #
      # Суммы кладём рядом обязательно: обновление внутри приложения
      # сверяет с ними скачанное и отказывается ставить при расхождении.
      - name: DMG and checksums
        if: steps.resolve.outputs.build == 'true'
        run: ./scripts/make_dmg.sh
      # Образ нотаризуем отдельно (нотаризация приложения на DMG не
      # распространяется), прошиваем и ПЕРЕСЧИТЫВАЕМ суммы: staple меняет
      # файл, а обновление внутри приложения сверяет скачанное с .sha256.
      - name: Notarize and staple DMG
        if: steps.resolve.outputs.build == 'true' && env.SIGNING == 'true' && env.NOTARY == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          ./scripts/notarize.sh app/build/Charoite.dmg app/build/Charoite.dmg \
            "$RUNNER_TEMP/notary-key.p8" "$NOTARY_KEY_ID" "$NOTARY_ISSUER_ID"
          for f in app/build/Charoite.dmg app/build/Charoite.app.zip; do
            shasum -a 256 "$f" | awk '{print $1}' > "$f.sha256"
          done
          # Финальная проверка глазами Gatekeeper: так увидит файл пользователь.
          spctl --assess --type execute --verbose=2 app/build/Charoite.app
          spctl --assess --type open --context context:primary-signature --verbose=2 app/build/Charoite.dmg
      - name: Attach to release
        if: steps.resolve.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" --repo "$REPO" --clobber \
            app/build/Charoite.dmg \
            app/build/Charoite.dmg.sha256 \
            app/build/Charoite.app.zip \
            app/build/Charoite.app.zip.sha256
      # Временная связка и ключ нотаризации живут ровно один прогон.
      - name: Remove signing material
        if: always()
        run: |
          [ -n "${CHAROITE_SIGN_KEYCHAIN:-}" ] && security delete-keychain "$CHAROITE_SIGN_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/developer-id.p12"

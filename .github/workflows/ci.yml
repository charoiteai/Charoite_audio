name: CI

# Пуш в ЛЮБУЮ ветку: сигнал должен приходить в момент пуша, а не после
# оформления PR. Пуш в ветку с открытым PR рождает два события (push и
# pull_request) — пусть бегут оба, но event_name в ключе группы обязателен:
# без него прогоны отменяют друг друга, и обязательный чек приходит в PR
# отменённым, то есть красным.
on:
  push:
  pull_request:

concurrency:
  # PR ключуется НОМЕРОМ: head_ref — имя ветки без владельца форка,
  # и два форк-PR с веткой main отменяли бы чеки друг друга
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

# Токену здесь нужно только читать репозиторий. Без этой строки
# он получает права по умолчанию на всё, что настроено в репозитории.
permissions:
  contents: read

# Инструменты проверок — с пинами: гейт, который ставится «последней
# версией» с PyPI, ломается или молчит в тот день, когда меняется сам
# инструмент, а не наш код (аудит DeepSeek 16.08). Обновлять руками и
# осознанно, вместе с проверкой прогона.
env:
  RUFF_VERSION: "0.16.3"
  SEMGREP_VERSION: "1.173.0"
  MYPY_VERSION: "2.3.1"
  PYYAML_VERSION: "6.0.3"
  PYTEST_VERSION: "9.1.1"
  # Тесты поднимают настоящие потоки и ждут их join: один зависший
  # съедал бы весь потолок джоба, а в логе не было бы видно, какой.
  PYTEST_TIMEOUT_VERSION: "2.4.0"
  # Известный setuptools в тестовом venv: колесо пакета графа тест собирает
  # офлайн, без изоляции (`pip wheel --no-build-isolation`), то есть
  # setuptools окружения, и сверяет его версию с этим пином (№427, часть 1). Сборку
  # самой дистрибуции (`pip install .`) пин не трогает — у неё изоляция и
  # свой [build-system]. Пара с nightly.yml: pytest, pytest-timeout,
  # setuptools; остальные пины живут только здесь. Dependabot их не видит.
  SETUPTOOLS_VERSION: "83.0.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    # замер: job идёт около минуты (56–61 с на #633–#639, 26.09) — потолок с запасом
    # на установку semgrep и mypy, а не на висящий раннер (№395)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ruff (errors only — style is not gated)
        # Тесты линтуются тоже: до 21.09 их смотрел только pre-commit, и
        # неиспользуемый импорт в тесте доезжал до main на машине без хука
        # (круг 15 по коду №327, DS C1).
        run: pipx run "ruff==${RUFF_VERSION}" check src/ tests/ scripts/   # правила — [tool.ruff.lint] в pyproject.toml
      - name: Byte-compile all sources
        run: python -m compileall -q src/
      # Покрытие такого не ловит: тест без единой проверки покрывает строки
      # на сто процентов и зелёный всегда — и именно поэтому опаснее дыры,
      # он гасит тревогу видом галочки в CI.
      - name: Тест обязан быть способен упасть
        run: python scripts/check_test_assertions.py tests
      - name: Shellcheck (все .sh)
        run: |
          sudo apt-get install -y -q shellcheck >/dev/null
          shellcheck scripts/*.sh
      - name: Semgrep (security-правила; nosemgrep — только с обоснованием)
        run: |
          pip -q install "semgrep==${SEMGREP_VERSION}"
          semgrep --config auto --error --quiet src/ scripts/
      - name: Mypy (советник — не гейт, смотреть в логах)
        continue-on-error: true
        run: |
          pip -q install "mypy==${MYPY_VERSION}"
          mypy --ignore-missing-imports --no-strict-optional src/
      - name: Example config is valid YAML with required keys
        run: |
          pip -q install "pyyaml==${PYYAML_VERSION}"
          python - <<'EOF'
          import yaml
          cfg = yaml.safe_load(open("config/config.example.yaml"))
          for path in ("audio.samplerate", "stt.backend", "stt.language",
                       "llm.model", "llm.num_ctx", "sufler.user_name",
                       "sufler.language", "log.transcripts_dir"):
              node = cfg
              for k in path.split("."):
                  assert k in node, f"missing key: {path}"
                  node = node[k]
          print("config example: ok")
          EOF

  # Python-тесты в CI не гонялись вообще: tests/ существовали, но ни один
  # workflow их не запускал (swift-tests.yml гоняет только app/). Тест, который
  # никто не гоняет, — это комментарий: он не удержит ни один инвариант.
  tests:
    name: pytest (src/)
    runs-on: ubuntu-latest
    # Потолок job — сумма потолков шагов, у повторов PortAudio — свой худший
    # случай: сторож в tests/test_workflows.py тот же, что у job mutation (№395).
    # Прежние 10 минут обрывали шаг посреди второй попытки из трёх обещанных.
    # 2 + 3 + 12 + 6 + 12 + 3 (гейт раскладки) = 38, плюс минута на post-шаги `uses:`
    # и старт job — они в сумму шагов не входят (сторож CEILING_MARGIN).
    timeout-minutes: 39
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        timeout-minutes: 3
        with:
          python-version: "3.12"
          cache: pip
      # main/daemon тянут sounddevice на импорте — без PortAudio падает сбор тестов
      #
      # Через timeout и повтор: 19.08 шаг дважды завис на apt (зеркало или
      # фоновый apt-daily держит замок) и оба раза убил джоб по 10-минутному
      # потолку — повтор того же прогона проходил за две минуты. Обычный
      # случай — 15 секунд; висящая попытка теперь стоит полторы минуты,
      # а не весь бюджет джоба.
      - name: PortAudio
        # три попытки по 90 + 120 + 15 с — до 11¼ мин, как у job mutation
        timeout-minutes: 12
        run: |
          for try in 1 2 3; do
            sudo timeout 90 apt-get update -qq || echo "apt-get update: попытка $try мимо"
            if sudo timeout 120 apt-get install -y -qq libportaudio2; then exit 0; fi
            echo "libportaudio2: попытка $try не прошла, ждём 15 с"
            sleep 15
          done
          exit 1
      - name: Deps
        timeout-minutes: 6
        run: pip -q install . "pytest==${PYTEST_VERSION}" "pytest-timeout==${PYTEST_TIMEOUT_VERSION}" "setuptools==${SETUPTOOLS_VERSION}"
      # замер: около 4 минут (3:55–3:57 на #633, 26.09)
      - name: pytest
        timeout-minutes: 12
        run: python -m pytest tests/ -q
      # гейт раскладки как гейт: main — единственный вызывающий check, он передаёт
      # всё; тест-пересказ выше можно выключить забытым параметром (выходной
      # круг 1 по №424, DS C1 — так пропал адрес шва)
      - name: layout gate
        # вердикт раскладки нужен и при красном pytest: упавший сбор тестов иначе
        # гасит его вместе с тестом-пересказом (выходной круг 3 по №424, DS I1)
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: python3 scripts/layout_map.py --check

  mutation:
    name: mutation (changed lines)
    runs-on: ubuntu-latest
    # Потолок job — сумма потолков шагов, а бюджет мутатора плюс худший прогон
    # набора укладывается в потолок своего шага (сторож — tests/test_workflows.py,
    # №395). Без этого GitHub обрывал job на 40-й минуте вместе с отчётом (#625: 34
    # из 40), и «что проверено» не доезжало никуда. 2 + 3 + 12 + 6 + 50 + 1 + 2
    # (артефакт шарда) = 76, плюс минута запаса (CEILING_MARGIN).
    timeout-minutes: 77
    if: github.event_name == 'pull_request'
    # Весь план — четырьмя шардами, без среза (№441): один прогон с `--max 40`
    # проверял 28 из 54 (#647) и оставлял «проверено не всё» жёлтым, а полный прогон
    # уезжал на машину владельца на час. Шард — `i % N`, каждый со своим бюджетом;
    # судит не шаг шарда, а job `mutation verdict` по машинным строкам всех четырёх.
    # Число шардов — здесь и в `--shard …/4`; сторож держит их равными.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Имя отчёта шарда — одно на job: его пишет мутатор, читает сводка и забирает
    # артефакт (машинная строка — это имя плюс суффикс, `shard_line_path`). Три
    # литерала расходились бы молча: артефакт пуст, вердикт красный на каждом PR
    # (выходной круг 2 по №441, DS M1).
    env:
      REPORT: mutation-report-${{ matrix.shard }}.txt
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          persist-credentials: false
          fetch-depth: 0   # диапазон base...HEAD — нужна история
      - uses: actions/setup-python@v7
        timeout-minutes: 3
        with:
          python-version: "3.12"
          cache: pip
      - name: PortAudio
        # три попытки по 90 + 120 + 15 с — до 11¼ мин: потолок не меньше своего
        # цикла повторов (облако, I3 круга 5 по №395)
        timeout-minutes: 12
        run: |
          for try in 1 2 3; do
            sudo timeout 90 apt-get update -qq || echo "apt-get update: попытка $try мимо"
            if sudo timeout 120 apt-get install -y -qq libportaudio2; then exit 0; fi
            sleep 15
          done
          exit 1
      - name: Deps
        timeout-minutes: 6
        run: pip -q install . "pytest==${PYTEST_VERSION}" "pytest-timeout==${PYTEST_TIMEOUT_VERSION}" "setuptools==${SETUPTOOLS_VERSION}"
      # Единственная проверка, которая отвечает «а тест вообще держит что-нибудь»:
      # в изменённые строки возвращается дефект, и прогон обязан покраснеть.
      # Покрытие на это не отвечает — тест без единой проверки покрывает строку
      # на сто процентов и зелёный всегда. Скрипт лежал в репо с августа и
      # гонялся только руками (№67); отсюда он становится приёмкой PR.
      # Обходных флагов нет: без данных владельца гвард занятости молчит сам
      # (`machine_busy` на голом каталоге пуст — замер 22.09), а флаг «владельца
      # здесь нет» на машине владельца работал как `--force` (круг 1 по №339).
      # `--max all`: срез в шарде вернул бы «проверено не всё». Бюджет `--budget-s`
      # считается от старта мутатора и покрывает базовый прогон шарда: при нехватке
      # мутатор сам останавливается с исходом partial и отчётом «проверено K из M»
      # (№395), а вердикт читает это как красный. Шаг сам не краснеет: слово исхода
      # и счёт шарда уходят в `<report>.json`, их судит job вердикта.
      - name: mutate changed lines
        timeout-minutes: 50
        env:
          # База диапазона — текущая голова ветки назначения, а не
          # `pull_request.base.sha`: тот остаётся головой на момент открытия PR, а
          # HEAD здесь — merge-коммит с сегодняшней веткой назначения, и
          # «старая база...merge» тянула в план чужие правки, влитые в main после
          # открытия PR (замер на #649: 357 мутантов вместо 96, doctor.py и
          # layout_map.py из других PR — доли не уложились в бюджет).
          BASE_REF: ${{ github.base_ref }}
          SHARD: ${{ matrix.shard }}
          # мутатор — точка входа: корень данных называется явно, а не угадывается
          # по месту скрипта (№440); у раннера данных владельца нет, корень — сам checkout
          CHAROITE_ROOT: ${{ github.workspace }}
        run: |
          rc=0; python scripts/mutate_check.py --range "origin/$BASE_REF...HEAD" --shard "$SHARD/4" --max all --timeout 120 --budget-s 2400 --report "$REPORT" || rc=$?
          echo "шард $SHARD: код мутатора $rc — судит job mutation verdict"
      # Отчёт пишется после каждого мутанта, поэтому доезжает и тогда, когда шаг
      # оборвал свой потолок: итог — в сводку прогона, а не только в лог.
      - name: mutation report
        if: always()
        timeout-minutes: 1
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          if [ -f "$REPORT" ]; then
            { echo "### Мутация, шард $SHARD"; echo '```'; cat "$REPORT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Мутация, шард $SHARD: отчёта нет — мутатор не дошёл до первой записи" >> "$GITHUB_STEP_SUMMARY"
          fi
      # Отчёт и машинная строка шарда — вердикту. `if: always()`: шаг, оборванный
      # потолком, отчёт на диске оставил, и вердикт обязан его увидеть, а не «нет
      # отчёта» (круг 1 по №441, DS I6). Имя артефакта — с номером шарда: одинаковые
      # имена в матрице затирали бы друг друга.
      - name: shard artifact
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: ${{ env.REPORT }}*
          if-no-files-found: ignore
          retention-days: 7

  # Вердикт мутаций — один на PR, по машинным строкам всех шардов (№441). Правило —
  # функция мутатора `merge_shards`, а не разбор отчётов здесь: отчётов ровно N,
  # у всех один N, сумма M равна P; зелёный — все непустые шарды `ok`; P = 0 —
  # «мутировать нечего». Нет отчёта шарда — красный.
  mutation-verdict:
    name: mutation verdict
    needs: mutation
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Имя отчёта вердикта — одно на job, как у шардов `env.REPORT`: его пишет судья
    # и читает сводка (выходной круг 3 по №441, DS M2)
    env:
      VERDICT: mutation-verdict.txt
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        timeout-minutes: 3
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        timeout-minutes: 2
        with:
          pattern: mutation-shard-*
          merge-multiple: true
          path: shards
      - name: verdict
        timeout-minutes: 1
        run: python scripts/mutate_check.py --merge-shards shards --report "$VERDICT"
      - name: verdict summary
        if: always()
        timeout-minutes: 1
        run: |
          if [ -f "$VERDICT" ]; then
            { echo "### Мутация: вердикт по шардам"; echo '```'; cat "$VERDICT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Мутация: вердикта нет — см. лог шага verdict" >> "$GITHUB_STEP_SUMMARY"
          fi

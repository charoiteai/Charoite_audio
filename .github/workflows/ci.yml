name: CI

# Пуш в ЛЮБУЮ ветку: сигнал должен приходить в момент пуша, а не после
# оформления PR. Пуш в ветку с открытым PR рождает два события (push и
# pull_request) — пусть бегут оба, но event_name в ключе группы обязателен:
# без него прогоны отменяют друг друга, и обязательный чек приходит в PR
# отменённым, то есть красным.
on:
  push:
  pull_request:

concurrency:
  # PR ключуется НОМЕРОМ: head_ref — имя ветки без владельца форка,
  # и два форк-PR с веткой main отменяли бы чеки друг друга
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

# Токену здесь нужно только читать репозиторий. Без этой строки
# он получает права по умолчанию на всё, что настроено в репозитории.
permissions:
  contents: read

# Инструменты проверок — с пинами: гейт, который ставится «последней
# версией» с PyPI, ломается или молчит в тот день, когда меняется сам
# инструмент, а не наш код (аудит DeepSeek 16.08). Обновлять руками и
# осознанно, вместе с проверкой прогона.
env:
  RUFF_VERSION: "0.16.3"
  SEMGREP_VERSION: "1.173.0"
  MYPY_VERSION: "2.3.1"
  PYYAML_VERSION: "6.0.3"
  PYTEST_VERSION: "9.1.1"
  # Тесты поднимают настоящие потоки и ждут их join: один зависший
  # съедал бы весь потолок джоба, а в логе не было бы видно, какой.
  PYTEST_TIMEOUT_VERSION: "2.4.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ruff (errors only — style is not gated)
        # Тесты линтуются тоже: до 21.09 их смотрел только pre-commit, и
        # неиспользуемый импорт в тесте доезжал до main на машине без хука
        # (круг 15 по коду №327, DS C1).
        run: pipx run "ruff==${RUFF_VERSION}" check --select E9,F src/ tests/ scripts/
      - name: Byte-compile all sources
        run: python -m compileall -q src/
      # Покрытие такого не ловит: тест без единой проверки покрывает строки
      # на сто процентов и зелёный всегда — и именно поэтому опаснее дыры,
      # он гасит тревогу видом галочки в CI.
      - name: Тест обязан быть способен упасть
        run: python scripts/check_test_assertions.py tests
      - name: Shellcheck (все .sh)
        run: |
          sudo apt-get install -y -q shellcheck >/dev/null
          shellcheck scripts/*.sh
      - name: Semgrep (security-правила; nosemgrep — только с обоснованием)
        run: |
          pip -q install "semgrep==${SEMGREP_VERSION}"
          semgrep --config auto --error --quiet src/ scripts/
      - name: Mypy (советник — не гейт, смотреть в логах)
        continue-on-error: true
        run: |
          pip -q install "mypy==${MYPY_VERSION}"
          mypy --ignore-missing-imports --no-strict-optional src/
      - name: Example config is valid YAML with required keys
        run: |
          pip -q install "pyyaml==${PYYAML_VERSION}"
          python - <<'EOF'
          import yaml
          cfg = yaml.safe_load(open("config/config.example.yaml"))
          for path in ("audio.samplerate", "stt.backend", "stt.language",
                       "llm.model", "llm.num_ctx", "sufler.user_name",
                       "sufler.language", "log.transcripts_dir"):
              node = cfg
              for k in path.split("."):
                  assert k in node, f"missing key: {path}"
                  node = node[k]
          print("config example: ok")
          EOF

  # Python-тесты в CI не гонялись вообще: tests/ существовали, но ни один
  # workflow их не запускал (swift-tests.yml гоняет только app/). Тест, который
  # никто не гоняет, — это комментарий: он не удержит ни один инвариант.
  tests:
    name: pytest (src/)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # main/daemon тянут sounddevice на импорте — без PortAudio падает сбор тестов
      #
      # Через timeout и повтор: 19.08 шаг дважды завис на apt (зеркало или
      # фоновый apt-daily держит замок) и оба раза убил джоб по 10-минутному
      # потолку — повтор того же прогона проходил за две минуты. Обычный
      # случай — 15 секунд; висящая попытка теперь стоит полторы минуты,
      # а не весь бюджет джоба.
      - name: PortAudio
        timeout-minutes: 6
        run: |
          for try in 1 2 3; do
            sudo timeout 90 apt-get update -qq || echo "apt-get update: попытка $try мимо"
            if sudo timeout 120 apt-get install -y -qq libportaudio2; then exit 0; fi
            echo "libportaudio2: попытка $try не прошла, ждём 15 с"
            sleep 15
          done
          exit 1
      - name: Deps
        run: pip -q install . "pytest==${PYTEST_VERSION}" "pytest-timeout==${PYTEST_TIMEOUT_VERSION}"
      - name: pytest
        run: python -m pytest tests/ -q

  mutation:
    name: mutation (changed lines)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0   # диапазон base...HEAD — нужна история
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: PortAudio
        timeout-minutes: 6
        run: |
          for try in 1 2 3; do
            sudo timeout 90 apt-get update -qq || echo "apt-get update: попытка $try мимо"
            if sudo timeout 120 apt-get install -y -qq libportaudio2; then exit 0; fi
            sleep 15
          done
          exit 1
      - name: Deps
        run: pip -q install . "pytest==${PYTEST_VERSION}" "pytest-timeout==${PYTEST_TIMEOUT_VERSION}"
      # Единственная проверка, которая отвечает «а тест вообще держит что-нибудь»:
      # в изменённые строки возвращается дефект, и прогон обязан покраснеть.
      # Покрытие на это не отвечает — тест без единой проверки покрывает строку
      # на сто процентов и зелёный всегда. Скрипт лежал в репо с августа и
      # гонялся только руками (№67); отсюда он становится приёмкой PR.
      # Обходных флагов нет: без данных владельца гвард занятости молчит сам
      # (`machine_busy` на голом каталоге пуст — замер 22.09), а флаг «владельца
      # здесь нет» на машине владельца работал как `--force` (круг 1 по №339).
      # `--max 30`: прогон #605 при 20 — 9 минут на 20 мутантов (~27 с каждый);
      # 40 ≈ 18 минут при потолке job 40 (DS I8); на 3fdbbc2 при 30 срезано 5.
      - name: mutate changed lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          rc=0; python scripts/mutate_check.py --range "$BASE_SHA...HEAD" --max 40 --timeout 120 || rc=$?
          # Исход — одно слово от канона, а не цифра и не grep по выводу: «судили
          # подмножество» раньше было видно только в логе (круг 3 по №339, DS I1).
          case "$(python -c "import sys; sys.path.insert(0,'src'); import exit_codes; print(exit_codes.outcome($rc))")" in
            ok)      echo "::notice::мутация: проверено всё, выживших нет" ;;
            nothing) echo "::notice::мутировать было нечего — в диапазоне нет наших python-строк" ;;
            partial) echo "::warning::мутация проверила НЕ ВСЁ (срез потолком или прерывание) — в логе видно, сколько" ;;
            # строки в диапазоне есть, а мутантов ноль: не «нечего проверять», а слепое
            # пятно мутатора — предупреждение, а не зелёная тишина (№386)
            unmutable) echo "::warning::строки в диапазоне есть, а мутировать в них нечего — в логе видно, из чего собран пустой план" ;;
            *)       exit $rc ;;
          esac

# Swift-тесты приложения: гоняются, когда изменение трогает app/.
# macos-раннер: на публичном репо бесплатно; кэш SPM ускоряет прогон.
name: swift-tests

# Пуш в любую ветку (paths-фильтр остаётся): Swift-правка должна
# компилироваться в момент пуша, а не после оформления PR. Ключ группы
# включает event_name — иначе push- и pull_request-прогоны одного коммита
# отменяют друг друга (см. ci.yml).
on:
  pull_request:
    paths:
      - "app/**"
      - "app-ios/**"
      - "scripts/install_engine.py"
      - ".swiftlint.yml"
      - ".github/workflows/swift-tests.yml"
  push:
    paths:
      - "app/**"
      - "app-ios/**"
      - "scripts/install_engine.py"
      - ".swiftlint.yml"
      - ".github/workflows/swift-tests.yml"

concurrency:
  # PR ключуется НОМЕРОМ: head_ref — имя ветки без владельца форка,
  # и два форк-PR с веткой main отменяли бы чеки друг друга
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

# Токену здесь нужно только читать репозиторий. Без этой строки
# он получает права по умолчанию на всё, что настроено в репозитории.
permissions:
  contents: read

jobs:
  test:
    name: swift test (app)
    # macos-26, а не 15: живой черновик диктовки использует SpeechAnalyzer /
    # DictationTranscriber / AssetInventory (SDK 26), обёрнутые в #available
    # — как раньше ScreenCaptureKit требовал SDK 15. Минимальная версия
    # приложения остаётся 14 — она задана в Package.swift; SDK нужен свежее
    # ровно для того, чтобы такой код вообще компилировался.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: SwiftLint (errors — гейт, пороги в .swiftlint.yml)
        shell: bash
        run: |
          # pipefail обязателен: без него `swiftlint | grep` возвращал код grep,
          # и сломанный или неустановленный линтер давал зелёный шаг — галочка
          # была, проверки не было.
          set -euo pipefail
          brew list swiftlint >/dev/null 2>&1 || brew install swiftlint >/dev/null
          swiftlint lint --quiet | tee /tmp/lint.out
          ! grep -q error /tmp/lint.out
      # Версия тулчейна — в ключе кэша: имя образа macos-26 не меняется, когда
      # в нём обновляется Swift, а .build одной версии (и одного бэкенда сборки —
      # со Swift 6.4 раскладка другая, №745) другой не годится.
      - name: Swift toolchain id
        id: swift
        shell: bash
        run: |
          set -euo pipefail
          echo "id=$(swift --version 2>/dev/null | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: app/.build
          key: spm-macos-26-${{ steps.swift.outputs.id }}-${{ hashFiles('app/Package.swift') }}
          restore-keys: spm-macos-26-${{ steps.swift.outputs.id }}-
      # Живые пробы — отдельный test target: компилируем, чтобы не гнили
      # сигнатуры, но не запускаем на CI без приватного графа и моделей.
      - name: Build app and all test targets
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          swift build --build-tests
          # make_app.sh берёт бинарь по --show-bin-path (№745): на тулчейне
          # раннера путь обязан вести к настоящему продукту.
          test -x "$(swift build --show-bin-path)/CharoiteApp"
      # Фильтр, не совпавший ни с одним тестом, даёт exit 0 при нуле
      # прогонов — «зелёный без прогона» (круг-1 по #426: DS, GLM и Codex
      # сошлись). Поэтому сверяем строку Executed: тестов должно быть >0.
      # Тесты записи конфига кнопкой Nemotron сверяют правку тем же PyYAML, что у
      # демона (`install_engine.py --verify-config-edit`, №622): без него тесты падают.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: PyYAML для проверки записи конфига
        run: python -m pip install -q "pyyaml==6.0.3"
      - name: Test deterministic suite
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          swift test --skip-build --filter '^CharoiteAppTests\.' 2>&1 | tee /tmp/swift-test.log
          grep -Eq 'Executed [1-9][0-9]* test' /tmp/swift-test.log

  ios:
    # iPhone-компаньон не собирался в CI ни разу: paths-фильтр покрывал только
    # app/**, поэтому правка в app-ios/ уезжала в main непроверенной и ломалась
    # у того, кто первым откроет Xcode. .swiftlint.yml при этом уже включал
    # app-ios/Sources — линтер был настроен, но не вызывался.
    name: build (app-ios)
    # macos-15, а не 14: xcodegen пишет проект в формате objectVersion 77, и
    # Xcode 15.4 с раннера macos-14 его не открывает («future project format»).
    # Зафиксировать формат в project.yml нельзя — опция objectVersion в
    # xcodegen 2.45 молча игнорируется.
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen >/dev/null
      - name: Generate project
        working-directory: app-ios
        run: xcodegen generate
      - name: Build
        working-directory: app-ios
        run: |
          xcodebuild -project CharoiteiOS.xcodeproj -scheme CharoiteiOS \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build

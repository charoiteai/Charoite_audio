name: Android tests

on:
  push:
    paths:
      - "app-android/**"
      - ".github/workflows/android-tests.yml"
  pull_request:
    paths:
      - "app-android/**"
      - ".github/workflows/android-tests.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: test, lint, assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      # assembleDebugAndroidTest собирает тест записи на устройстве. Запустить
      # его в CI нечем (нужен живой микрофон), но пусть хотя бы компилируется:
      # иначе он тихо сгниёт при первом же переименовании в коде.
      - name: Unit tests, lint and debug build
        run: >-
          ./gradlew testDebugUnitTest lintDebug assembleDebug
          assembleDebugAndroidTest --no-daemon

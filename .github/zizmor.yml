# Настройка zizmor — линтера безопасности наших workflow.
#
# Отключаем ровно одно правило и объясняем почему: страж, у которого треть
# находок отброшена молча, читается как «тут всегда красно» и перестаёт
# работать вовсе.
rules:
  unpinned-uses:
    config:
      policies:
        # Закрепление actions на конкретный хеш коммита — правильная
        # практика против угона тега, но она несовместима с тем, как мы
        # держим зависимости в порядке: их обновляет dependabot, и в его
        # PR вместо «v7 → v8» появлялась бы пара сорокасимвольных строк.
        # Ревью таких PR превращается в доверие боту вслепую, а это хуже
        # угона тега у actions, которые мы используем: все они либо
        # официальные github/actions, либо крупные проекты с защитой тегов.
        #
        # Пересмотреть, если появится action от малоизвестного автора —
        # вот его как раз стоит закрепить на хеш поимённо.
        "*": ref-pin
